  ${catsHtml()}
  <section class="card"><h3>Respaldo <small>${ur ? 'último: ' + fechaCorta(ur) + ' ' + ur.slice(0,4) : 'nunca'}</small></h3>
    <p class="hint" style="margin-top:0">Los datos se guardan solo en este navegador de este teléfono. Si borras el historial del navegador o cambias de teléfono, se pierden. Haz un respaldo cada cierto tiempo (mándatelo por WhatsApp o correo).</p>
    <button class="btn primary" data-act="exportar">💾 Guardar respaldo</button>
    <button class="btn" data-act="importar">📂 Cargar respaldo</button>
    <button class="btn" data-act="csv">📊 Exportar a Excel (CSV)</button>
  </section>
  <section class="card guia"><h3>Cómo usar la app</h3>
    <details><summary>➕ Agregar una compra</summary><p>En <b>Inicio</b> o <b>Movimientos</b> toca el botón <b>+</b> (abajo a la derecha). Escribe el <b>nombre</b> (en qué fue), elige <b>córdobas o dólares</b> y escribe el monto, elige la categoría y cómo pagaste (efectivo, tarjeta o transferencia). La fecha es hoy, salvo que la cambies; la nota es opcional. Toca <b>Guardar</b>.</p></details>
    <details><summary>💰 Anotar un ingreso</summary><p>Toca <b>+</b> y arriba elige <b>💰 Ingreso</b>. Escribe cuánto te entró, de qué fue, el tipo (ventas, trabajos extra, remesa…) y dónde entró (efectivo, tarjeta de débito o transferencia). Sale en verde en <b>Movimientos</b>, y en <b>Inicio</b> ves «Te queda»: ingresos menos gastos del mes. Los ingresos nunca se suman a los gastos ni al presupuesto. El <b>salario</b> no se anota aquí: va una sola vez en <b>Fijos → 💼 Salario</b> y se suma solo cada mes.</p></details>
    <details><summary>⚡ Anotar rápido lo de siempre</summary><p>En <b>Inicio</b>, «Anotar rápido» muestra tus compras más frecuentes: toca una y se abre ya llena; revisa el monto y toca <b>Guardar</b>.</p></details>
    <details><summary>✏️ Editar o borrar una compra o un ingreso</summary><p>Tócalo (en <b>Inicio</b> o en <b>Movimientos</b>), cambia lo que quieras y toca <b>Guardar</b>. Para quitarlo, toca <b>Eliminar</b> (justo después puedes tocar <b>Deshacer</b>).</p></details>
    <details><summary>📷 Fotos (recibo, factura, comprobante)</summary><p>Al anotar o editar una compra o un ingreso, toca <b>📷 Agregar foto</b>: puedes tomarla con la cámara o elegirla de la galería (hasta 5). Toca una foto para verla grande o <b>Quitarla</b>. Se guarda al tocar <b>Guardar</b>. Las fotos quedan en este teléfono y van dentro del respaldo. En la lista, 📷 indica que tiene fotos.</p></details>
    <details><summary>📅 Ver otro mes</summary><p>En <b>Inicio</b> y <b>Movimientos</b>, usa las flechas <b>‹ ›</b> de arriba.</p></details>
    <details><summary>🔍 Ver solo gastos o solo ingresos, buscar o ver una categoría</summary><p>En <b>Movimientos</b>, arriba eliges <b>Todo</b>, <b>Gastos</b> o <b>Ingresos</b> y ves el total del mes de cada uno. También, escribe en el buscador (busca en todos los meses). En <b>Inicio</b>, toca una barra de «¿En qué se va?» para ver solo esa categoría; «Quitar ✕» vuelve a mostrar todo.</p></details>
    <details><summary>👥 Ayudantes</summary><p>En <b>Ajustes → 👥 Ayudantes → + Agregar</b> pon el nombre y la cuenta de banco de la persona; se crea su <b>archivo de acceso</b> (solo tus productos, paquetes y precios). Mándaselo por WhatsApp: ella abre esta misma app, va a <b>Ajustes → 📂 Cargar respaldo</b> y lo elige. Su teléfono queda en modo ayudante: solo agrega clientes y cobra en su cuenta; nunca ve lo tuyo. Cuando ella te mande su archivo, tócalo en <b>📥 Cargar lo que te envió</b>: sus clientes y cobros entran a tu app marcados con 🏦 su cuenta, sin duplicarse.</p></details>
    <details><summary>📊 Finanzas</summary><p>En <b>Finanzas</b> ves lo que te queda este mes y cuánto ahorras, una <b>gráfica de 6 meses</b> (lo que entró y salió), <b>💡 lo que cambió</b> contra el mes pasado, tus <b>límites por categoría</b>, tus <b>metas de ahorro</b>, <b>lo que debes</b> y tu <b>balance</b>. Con <b>+</b> agregas una meta, un límite, una deuda o un pago de tarjeta. Los gastos hormiga también están ahí.</p></details>
    <details><summary>🎯 Límites por categoría</summary><p>En <b>Finanzas → Límites</b> pon un tope al mes para una categoría (ej. Comida C$ 6,000). La barra se pone amarilla al 80% y roja si te pasas, también en «¿En qué se va?» de Inicio, y al anotar un gasto te avisa.</p></details>
    <details><summary>🐷 Metas de ahorro</summary><p>En <b>Finanzas → Metas</b> crea una meta: para qué, cuánto, en qué moneda y para cuándo (opcional). Con <b>💰 Aportar</b> anotas lo que guardas (o retiras). Te dice cuánto ahorrar al mes para llegar a tiempo.</p></details>
    <details><summary>🧾 Deudas y tarjetas de crédito</summary><p>En <b>Finanzas → Lo que debes</b> salen tus tarjetas de crédito: lo que debes es lo que ya debías al agregarla + lo que compraste con ella − lo que le pagaste. Con <b>💵 Pagar</b> anotas el pago (no es un gasto nuevo). Con <b>+ Deuda</b> anotas préstamos que tú debes (cuánto, cuota y día de pago); cada pago puede anotarse solo como gasto. Los pagos de los próximos 7 días salen en Inicio.</p></details>
    <details><summary>💳 Tarjetas</summary><p>En <b>Ajustes → Mis tarjetas</b> agrega tus tarjetas (nombre, crédito o débito, últimos 4 números y, si quieres, límite, día de corte y de pago). Al anotar un gasto y elegir <b>Pago: Tarjeta</b>, toca cuál usaste (o <b>+ Agregar tarjeta</b> ahí mismo). En Ajustes ves cuánto llevas este mes en cada una.</p></details>
    <details><summary>💼 Inversión en créditos</summary><p>En <b>Clientes</b>, arriba, ves cuánto tienes invertido en los créditos que te quedan (créditos × lo que te cuesta cada uno), cuánto sacarías si los vendes (con lo que cobras en promedio por crédito) y la ganancia aproximada; también lo que has comprado y ganado desde que empezaste. Es un aproximado: revisa que el costo de cada producto esté al día.</p></details>
    <details><summary>🔁 Fijos y suscripciones</summary><p>En <b>Fijos</b> toca <b>+</b>: elige si es gasto fijo o suscripción y anota el nombre, el monto de cada cobro, cada cuánto se cobra (mensual, quincenal, semanal o anual), la categoría y la fecha de un cobro. Se suman solos a cada mes y avisan los próximos cobros. Toca uno para editarlo o <b>Eliminarlo</b>. Para tu <b>salario</b>, elige <b>💼 Salario</b>: se suma solo a tus ingresos de cada mes. Los demás ingresos no son fijos: anótalos cada vez con <b>+</b> → <b>💰 Ingreso</b>.</p></details>
    <details><summary>🏷️ Categorías</summary><p>En <b>Ajustes → Categorías</b> toca una para cambiarle el nombre, el ícono o el grupo, o para <b>Eliminarla</b> (sus compras y fijos pasan a «Otros»; justo después puedes tocar <b>Deshacer</b>). <b>Agregar categoría</b> crea una nueva. «Otros» no se puede borrar. También mientras anotas una compra, un fijo o un ingreso: junto a <b>Categoría</b> (o <b>Tipo de ingreso</b>) toca <b>✏️ Editar</b>, luego toca la que quieras cambiar o <b>➕ Nueva</b>; al terminar vuelves a lo que estabas anotando sin perder nada. «Salario» y «Otros ingresos» no se pueden borrar.</p></details>
    <details><summary>🏪 Negocio: productos y paquetes</summary><p>En <b>Clientes</b> toca <b>+ Agregar</b> en «Productos y paquetes»: nombre (ej. Netflix), moneda, cuánto te cuesta cada crédito y cuántos créditos tienes. Abajo pon tus <b>paquetes</b>: nombre, cuántos créditos usa, a cuánto se lo vendes al cliente y cuántos meses dura (normalmente 1). Te muestra cuánto ganas en cada uno. Cuando compres créditos toca <b>📦 Compré créditos</b> y se suman.</p></details>
    <details><summary>👤 Clientes y renovaciones</summary><p>Toca <b>👤 Cliente nuevo</b>: nombre, teléfono (opcional) y su paquete. Si ya te pagó, «Sí, activar» cobra el paquete, descuenta sus créditos y lo deja activo un mes; si ya estaba activo de antes, elige «Ya estaba activo» y pon hasta cuándo. <b>Nada se renueva solo</b>: cuando a un cliente le falten 7 días o ya se le venció, sale en <b>«Por renovar»</b> (y en Inicio). Tú tocas <b>✅ Renovó</b> (se cobra, se descuentan los créditos de su paquete y queda activo un mes más) o <b>❌ No renovó</b> (pasa a «No renovaron»; si vuelve, ábrelo y toca Renovó). Justo después puedes tocar <b>Deshacer</b>. Toca un cliente para ver su <b>ficha</b> (como un recibo): estado, paquete, vencimiento, lo que debe y su acceso (toca un dato para copiarlo); desde ahí lo renuevas, mandas sus datos, su recibo en PDF o el aviso, y con <b>✏️ Editar</b> cambias lo que quieras.</p></details>
    <details><summary>💳 Vender créditos y 📝 fiado</summary><p>En <b>Clientes</b> toca <b>💳 Vender créditos</b> (o dentro de un cliente): elige o escribe el cliente, pon la <b>cantidad</b> de créditos y el <b>precio total</b> a mano, la moneda y el método; se descuentan de tus créditos y sale su recibo. En cualquier cobro puedes marcar <b>📝 Fiado</b>: lo que abonó (si abonó algo), cuándo pagará y una nota. Lo fiado sale en «Te deben (fiado)», en el cliente y en Inicio; cuando te pague, toca <b>💵 Pagó</b>, pon cuánto, el método y una nota. Lo cobrado es lo que se suma a «Te queda».</p></details>
    <details><summary>✎ Editar</summary><p>Todo lo que tiene <b>✎</b> se toca para editarlo o eliminarlo: compras, ingresos, fijos, productos, clientes, ventas (total, créditos, pagado o fiado, nota, fotos y pagos), compras de créditos y préstamos.</p></details>
    <details><summary>💬 Aviso de vencimiento</summary><p>Cuando a un cliente le falten los días que elijas en Ajustes (3, 5 o 7) o ya se le venció, sale en <b>«Por renovar»</b> con el botón <b>💬 Avisar</b> (también dentro del cliente): trae el mensaje listo con su servicio, la fecha y el precio. Lo puedes cambiar y enviarlo por <b>WhatsApp</b> o <b>copiarlo</b>; el cliente queda marcado «avisado».</p></details>
    <details><summary>🔐 Usuario y contraseña</summary><p>En cada cliente (y al renovar) hay un apartado para su <b>usuario, contraseña, perfil y PIN</b>. Puedes escribirlos o tomar una <b>foto</b> (o varias) de la pantalla donde salen: la app la lee sola y llena los campos; revísalos. Salen en su recibo (puedes quitarlos con la casilla) y con <b>🔐 Copiar acceso</b> copias solo esos datos para enviarlos. Si es IPTV, pega la <b>lista M3U</b>: el usuario y la contraseña se llenan solos.</p></details>
    <details><summary>📷 Fotos que se leen solas</summary><p>En los cobros, en <b>Vender créditos</b> y en <b>💵 Pagó</b>, la foto del comprobante se lee sola: busca el monto y lo pone en el total (o en el abono si es fiado); con varias fotos, <b>suma los montos</b>. Todo se lee dentro de tu teléfono: ninguna foto sale de él. La primera vez necesita internet para bajar el lector (unos 6 MB); revisa siempre el número.</p></details>
    <details><summary>🧾 Cobrar con detalle y recibos</summary><p>Al crear un cliente que ya pagó, o desde el cliente con <b>✅ Renovó…</b>, puedes tocar varios paquetes (o el mismo varias veces con <b>+</b>) para venderle más meses; los créditos y los meses se suman solos. El <b>total</b> viene con el precio normal y lo puedes cambiar (descuento o extra). Elige la <b>moneda del pago</b> (C$ o US$; se convierte con la tasa), el <b>método de pago</b> y sube la <b>foto del pago</b>. Al guardar sale el <b>recibo</b> con número: envíalo por <b>WhatsApp</b> (va directo al teléfono del cliente si lo anotaste), en <b>PDF</b>, como <b>imagen</b> o cópialo. Cualquier recibo lo vuelves a abrir tocando la venta o el pago en el cliente. El nombre de tu negocio en el recibo se pone aquí en Ajustes.</p></details>
    <details><summary>🤝 Préstamos que haces</summary><p>En <b>Clientes → Préstamos</b> toca <b>+ Prestar</b>: a quién, cuánto, en córdobas o dólares, la fecha y, si le cobras interés, cuánto te va a devolver en total. Puedes poner fotos (recibo, pagaré). No cuenta como gasto: se suma aparte en <b>«Te deben»</b>. Cuando te paguen, toca el préstamo y <b>💵 Anotar un abono</b>; al llegar a cero queda <b>Pagado</b>.</p></details>
    <details><summary>🐜 Gastos hormiga</summary><p>Son las compras pequeñas, de hasta el «Límite hormiga» de arriba. En <b>Hormiga</b> ves cuánto suman al mes y al año. Si una compra no es hormiga, toca <b>No es hormiga</b> y deja de contar.</p></details>
    <details><summary>💵 Dólares y córdobas</summary><p>En <b>Inicio</b>, arriba a la derecha del total, toca <b>C$</b> o <b>US$</b> para ver todos los totales en córdobas o en dólares. Al anotar una compra o un fijo, elige arriba del monto si fue en <b>Córdobas (C$)</b> o en <b>Dólares (US$)</b>. Lo que es en dólares se ve en dólares y, debajo, su equivalente; los totales, el presupuesto y las gráficas se suman en córdobas con la <b>Tasa de cambio</b> de aquí en Ajustes (de fábrica 1 US$ = 36.80 C$; la puedes cambiar a mano).</p></details>
    <details><summary>🎯 Presupuesto, moneda y modo día / noche</summary><p>Aquí en <b>Ajustes</b>: el presupuesto mensual (0 = sin presupuesto), la moneda principal y el modo día o noche. El sol o la luna de arriba cambia rápido entre día y noche.</p></details>
    <details><summary>💾 Respaldo</summary><p><b>Guardar respaldo</b> crea un archivo con todo (compras, ingresos, fijos y fotos): mándatelo por WhatsApp o correo. <b>Cargar respaldo</b> lo vuelve a poner (por ejemplo, en un teléfono nuevo). <b>Exportar a Excel</b> saca tus compras e ingresos en una tabla.</p></details>
    <details><summary>🔒 Bloqueo con PIN</summary><p>En <b>Ajustes → Bloqueo con PIN</b> pon un PIN de 4 a 6 números: la app lo pide al abrirla y al volver a ella después de un minuto. Si lo olvidas, «Olvidé mi PIN» borra los datos de este teléfono; luego los recuperas con <b>📂 Cargar respaldo</b>. Por eso, guarda respaldos seguido.</p></details>
    ${ES_SERVIDOR ? `<details><summary>🔑 Usuario y contraseña</summary><p>En <b>Cuenta</b>, toca <b>Cambiar usuario o contraseña</b>: pon los de ahora y los nuevos que quieras. Necesitas internet. Al cambiarlos tendrás que entrar otra vez.</p></details>` : ''}
  </section>
  <section class="card"><div class="split"><span>${S.gastos.length} compras</span><span>${S.ingresos.length} ingresos</span><span>${S.fijos.length + S.ingFijos.length} fijos</span></div>
    <button class="btn danger" data-act="borrarTodo">Borrar todo</button></section>`;
}

/* ================= Fotos (23/11/2026) — en IndexedDB del telefono, achicadas ================= */
const MAX_FOTOS = 5;
let fotoDbP = null;
function fotoDb(){
  if(!fotoDbP){
    fotoDbP = new Promise((res, rej) => {
      if(!window.indexedDB) return rej(new Error('sin indexedDB'));
      const r = indexedDB.open('mis-gastos-fotos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('fotos', {keyPath: 'id'});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    fotoDbP.catch(() => { fotoDbP = null; });
  }
  return fotoDbP;
}
async function fotoOp(modo, fn){
  const db = await fotoDb();
  return new Promise((res, rej) => {
    const tx = db.transaction('fotos', modo); let out;
    const r = fn(tx.objectStore('fotos')); if(r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => res(out); tx.onerror = tx.onabort = () => rej(tx.error || new Error('foto'));
  });
}
const fotoLeer = id => fotoOp('readonly', st => st.get(id)).then(o => o ? o.data : null);
const fotoGuardar = (id, data) => fotoOp('readwrite', st => st.put({id, data}));
const reFotoId = /^ft[0-9a-z]{6,30}$/;
const reFotoData = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
const nuevoFotoId = () => 'ft' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fotosDe = x => x && Array.isArray(x.fotos) ? x.fotos.filter(id => typeof id === 'string' && reFotoId.test(id)).slice(0, MAX_FOTOS) : [];
const nFotos = x => fotosDe(x).length ? ' · 📷 ' + fotosDe(x).length : '';
async function comprimirFoto(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('imagen')); i.src = url; });
    const k = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height); cx.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}
const fotosHtml = p => `<div class="lbl2">Fotos <small>recibo, factura, comprobante…</small></div><div class="fotos" id="${p}Fotos"></div>`;
let fotoDestino = null;
function ligarFotos(p, lista, op){   // op = {alAgregar(id, data), alQuitar(id)} (opcional)
  /* (antes) */   // `lista` son los ids de la hoja abierta; se guardan con el boton Guardar
  const cont = $('#'+p+'Fotos');
  const pintar = () => {
    cont.innerHTML = lista.map(id => `<button type="button" class="fth" data-fid="${id}"><img alt="Foto"></button>`).join('') +
      (lista.length < MAX_FOTOS ? `<button type="button" class="fadd" data-fadd="1">📷<span>Agregar foto</span></button>` : '');
    cont.querySelectorAll('.fth').forEach(b => fotoLeer(b.dataset.fid).then(d => { if(d) b.querySelector('img').src = d; else b.classList.add('rota'); }).catch(() => b.classList.add('rota')));
  };
  cont.onclick = ev => {
    if(ev.target.closest('[data-fadd]')){ fotoDestino = {lista, pintar, op}; $('#fileFoto').click(); return; }
    const t = ev.target.closest('.fth');
    if(t) verFoto(t.dataset.fid, () => { const i = lista.indexOf(t.dataset.fid); if(i >= 0) lista.splice(i, 1); pintar(); if(op && op.alQuitar) op.alQuitar(t.dataset.fid); });
  };
  pintar();
}
$('#fileFoto').addEventListener('change', async ev => {
  const files = [...ev.target.files]; ev.target.value = '';
  const d = fotoDestino; if(!d || !files.length) return;
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  let mal = 0;
  for(const f of files){
    if(d.lista.length >= MAX_FOTOS){ toast('Máximo ' + MAX_FOTOS + ' fotos'); break; }
    try{ const data = await comprimirFoto(f), id = nuevoFotoId(); await fotoGuardar(id, data); d.lista.push(id); d.pintar(); if(d.op && d.op.alAgregar) d.op.alAgregar(id, data); }
    catch(e){ mal++; }
  }
  if(mal) toast(mal === 1 ? 'No se pudo guardar la foto' : 'No se pudieron guardar ' + mal + ' fotos');
});
function verFoto(id, quitar){
  $('#fverImg').removeAttribute('src');
  fotoLeer(id).then(d => { if(d) $('#fverImg').src = d; }).catch(() => {});
  $('#fverQuitar').hidden = !quitar;
  $('#fverQuitar').onclick = () => { $('#fotoVer').hidden = true; quitar(); };
  $('#fotoVer').hidden = false;
}
$('#fverCerrar').onclick = () => { $('#fotoVer').hidden = true; };
async function limpiarFotosSueltas(){   // fotos de hojas canceladas o compras borradas, con mas de 2 dias
  if(!storageOk || (!S.gastos.length && !S.ingresos.length && !S.prestamos.length)) return;
  try{
    const usadas = new Set(); conFotos().forEach(x => fotosDe(x).forEach(id => usadas.add(id)));
    const ids = await fotoOp('readonly', st => st.getAllKeys()), limite = Date.now() - 2 * 864e5;
    const sueltas = (ids || []).filter(id => !usadas.has(id) && (parseInt(String(id).slice(2, 10), 36) || Infinity) < limite);
    if(sueltas.length) await fotoOp('readwrite', st => { sueltas.forEach(id => st.delete(id)); });
  }catch(e){}
}

function ultimoPorDesc(desc){
  const k = norm(desc);
  if(!k) return null;
  return S.gastos.slice().sort(ordenG).find(g => norm(g.desc) === k) || null;
}

  const cats = $('#fCats'), met = $('#fMet');
  const conv = () => { const v = parseMonto($('#fMonto').value || $('#fMonto').placeholder); $('#fConv').textContent = monSel !== monBase() && v > 0 ? '≈ ' + fmtEn(enBase(v, monSel), monBase()) + ' (1 US$ = ' + tasa() + ' C$)' : ''; };
  $('#fMon').onclick = ev => { const b = ev.target.closest('[data-mon]'); if(b){ monSel = b.dataset.mon; marcarChip($('#fMon'), 'mon', monSel); $('#fMonSim').textContent = monSel; conv(); } };

    abrirTarjeta(null, extra => abrirGasto(g, Object.assign(d, extra))); };   // agregar tarjeta sin perder lo escrito
  ligarEditCats('fCats', 'gasto', () => ({monto: $('#fMonto').value, mon: monSel, desc: $('#fDesc').value, cat: catSel, metodo: metSel, fecha: $('#fFecha').value, nota: $('#fNota').value, fotos: fotosSel.slice(), tarjeta: tarSel}), d => abrirGasto(g, d));

function abrirFijo(f, pre){

  abrirSheet(`<h2>${p ? esc(p.nombre) : 'Nuevo producto'}</h2>
    ${p ? '<button class="btn" id="pCom" style="margin:0 0 6px">📦 Compré créditos</button>' : ''}

    <div class="lbl2">Paquetes <small>lo que le vendes al cliente</small></div>
    <div id="pPaqs">${paqs.map(filaPaq).join('')}</div>
    <button type="button" class="btn" id="pAddK">➕ Agregar paquete</button>
    <div class="err" id="pErr"></div>
    <button class="btn primary" id="pOk">Guardar</button>
    ${p ? '<button class="btn danger" id="pDel">Eliminar producto</button>' : ''}
    <button class="btn ghost" id="pNo">Cancelar</button>`);
  const gan = () => { const c = parseMonto($('#pCos').value || '0');
    $('#pPaqs').querySelectorAll('.paq-ed').forEach(r => { const cr = entero(r.querySelector('.pk-c').value), pr = parseMonto(r.querySelector('.pk-p').value);
      r.querySelector('.pk-g').textContent = cr > 0 && pr >= 0 ? 'Te cuesta ' + fmtEn(cr * (c || 0), mon) + ' · ganas ' + fmtEn(pr - cr * (c || 0), mon) : ''; }); };
  $('#pPaqs').addEventListener('input', gan); $('#pCos').addEventListener('input', gan);
  $('#pPaqs').onclick = ev => { const x = ev.target.closest('.pk-x'); if(!x) return;
    if($('#pPaqs').querySelectorAll('.paq-ed').length <= 1){ toast('Debe quedar al menos un paquete'); return; } x.closest('.paq-ed').remove(); };
  $('#pAddK').onclick = () => { $('#pPaqs').insertAdjacentHTML('beforeend', filaPaq({id: '', n: '', cred: 1, precio: '', meses: 1})); gan(); const ns = $('#pPaqs').querySelectorAll('.pk-n'); ns[ns.length - 1].focus(); };
  $('#pMon').onclick = ev => { const b = ev.target.closest('[data-mon]'); if(b){ mon = b.dataset.mon; marcarChip($('#pMon'), 'mon', mon); gan(); } };
  gan();
  if(p) $('#pCom').onclick = () => abrirCompraNeg(null, {prod: p.id});
  $('#pNo').onclick = cerrarSheet;
  $('#pOk').onclick = () => {
    const nombre = $('#pNom').value.trim().slice(0, 60), costo = parseMonto($('#pCos').value || '0'), stock = entero($('#pSto').value || '0');
    if(!nombre){ $('#pErr').textContent = 'Ponle un nombre.'; return; }

    if(!isFinite(stock)){ $('#pErr').textContent = 'Escribe cuántos créditos tienes (puede ser 0).'; return; }
    const paquetes = []; let malo = '';
    $('#pPaqs').querySelectorAll('.paq-ed').forEach((r, i) => {
      const n = r.querySelector('.pk-n').value.trim().slice(0, 40) || 'Paquete ' + (i + 1);

      else if(!(precio >= 0)) malo = `En «${n}» escribe el precio al cliente.`;

    if(p){ Object.assign(p, datos); delete p.precio; } else S.productos.push(Object.assign({id: uid(), creado: Date.now()}, datos));

    S.productos.splice(i, 1); save(); cerrarSheet(); render();
    toast('Producto eliminado', () => { S.productos.splice(i, 0, p); save(); render(); });
  };
}

function ligarCobro(x, getProd, inicial, getBase){
  let items = [], manual = false, mon = monOk(getProd().mon), metodo = AYU ? 'Transferencia' : 'Efectivo';
  const fotos = [], tot = $('#' + x + 'CTot'), pm = () => monOk(getProd().mon);
  const normal = () => Math.round(items.reduce((a,i) => a + convMon(i.precio, pm(), mon) * i.cant, 0) * 100) / 100;   // igual que el recibo
  const cred = () => items.reduce((a,i) => a + i.cred * i.cant, 0), meses = () => items.reduce((a,i) => a + (i.meses || 1) * i.cant, 0);
  const resumen = () => {
    const pr = getProd(), t = parseMonto(tot.value), dif = Math.round((t - normal()) * 100) / 100;

    if(mo && mo !== mon) mon = mo;

    pintar(); $('#' + x + 'COcr').textContent = '📷 Leí en ' + (det ? 'las fotos ' + det + ' = ' : 'la foto ') + fmtEn(t, mon) + (fia ? ' → abono' : ' → total');
  }));
  const reset = ini => { items = []; manual = false; mon = pm(); (ini || []).forEach(i => agregar(i.paq, i.cant || 1)); pintar(); };
  reset(inicial);
  return {get: () => ({items: items.map(i => Object.assign({}, i, {precio: convMon(i.precio, pm(), mon)})), total: parseMonto(tot.value), mon, metodo, fotos: fotos.slice(), pago: getPg()}),
    reset, cred, refrescar: resumen};
}

/* Recibo de una venta: texto (WhatsApp / copiar) e imagen */
function textoRecibo(v, conAcceso){
  const m = monOk(v.mon), its = itemsDe(v), neg = String(S.ajustes.reciboNombre || '').trim();
  const L = ['🧾 *RECIBO' + (v.recibo ? ' ' + numRecibo(v) : '') + '*'];
  if(neg) L.push(neg);
  L.push('Fecha: ' + fechaLarga(v.fecha));
  if(v.cliente) L.push('Cliente: ' + v.cliente);
  L.push('', '*' + v.nom + '*');
  its.forEach(i => L.push('• ' + i.n + (i.cant > 1 ? ' ×' + i.cant : '') + (i.meses ? ' (' + plural(i.meses * i.cant, 'mes', 'meses') + ')' : '') + ': ' + fmtEn(i.precio * i.cant, m)));
  const dif = Math.round((totalVenta(v) - its.reduce((a,i) => a + i.precio * i.cant, 0)) * 100) / 100;
  if(v.items && Math.abs(dif) > 0.004) L.push((dif < 0 ? 'Descuento: −' : 'Ajuste: +') + fmtEn(Math.abs(dif), m));
  L.push('', '*Total: ' + fmtEn(totalVenta(v), m) + '*');
  if(v.metodo && (!v.fiado || pagadoV(v) > 0)) L.push('Pago: ' + v.metodo);
  if(v.fiado){ const pa = pagadoV(v), pe = pendienteV(v); if(pa > 0) L.push('Abonado: ' + fmtEn(pa, m));
    L.push(pe > 0 ? '*Saldo pendiente: ' + fmtEn(pe, m) + '*' + (v.promesa ? ' (pagará el ' + fechaLarga(v.promesa) + ')' : '') : '✅ Pagado completo'); }
  if(v.hasta) L.push('✅ Activo hasta el ' + fechaLarga(v.hasta));
  const acL = conAcceso ? accesoTexto(accesoVenta(v)) : [];
  if(acL.length) L.push('', '🔐 *Datos de acceso*', ...acL);
  L.push('', '¡Gracias por tu compra! 🙌');
  return L.join('\n');
}
function canvasRecibo(v, conAcceso){
  const m = monOk(v.mon), its = itemsDe(v), neg = String(S.ajustes.reciboNombre || '').trim();
  const W = 720, P = 50, c = document.createElement('canvas'); c.width = W; c.height = 2400;
  const x = c.getContext('2d'), F = (w, s) => w + ' ' + s + 'px -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
  const fit = (t, max) => { t = String(t); if(x.measureText(t).width <= max) return t; while(t.length > 1 && x.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…'; };
  const izq = (t, y, f, col, max) => { x.font = f; x.fillStyle = col; x.textAlign = 'left'; x.fillText(fit(t, max || W - 2 * P), P, y); };
  const der = (t, y, f, col) => { x.font = f; x.fillStyle = col; x.textAlign = 'right'; x.fillText(t, W - P, y); x.textAlign = 'left'; };
  const raya = y => { x.strokeStyle = '#d5d9df'; x.setLineDash([10, 8]); x.lineWidth = 2; x.beginPath(); x.moveTo(P, y); x.lineTo(W - P, y); x.stroke(); x.setLineDash([]); };
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, c.height); x.fillStyle = '#0f766e'; x.fillRect(0, 0, W, 16);
  let y = P + 42;
  izq('RECIBO', y, F(800, 44), '#15171c'); if(v.recibo) der(numRecibo(v), y, F(650, 28), '#525a68');
  y += 48; if(neg){ izq(neg, y, F(700, 30), '#0f766e'); y += 44; }
  izq('Fecha: ' + fechaLarga(v.fecha), y, F(400, 25), '#525a68'); y += 36;
  if(v.cliente){ izq('Cliente: ' + v.cliente, y, F(400, 25), '#525a68'); y += 36; }
  y += 6; raya(y); y += 52;
  izq(v.nom, y, F(700, 28), '#15171c'); y += 46;
  its.forEach(i => {
    const pr = fmtEn(i.precio * i.cant, m); x.font = F(600, 26); const wpr = x.measureText(pr).width;
    izq(i.n + (i.cant > 1 ? ' ×' + i.cant : ''), y, F(600, 26), '#15171c', W - 2 * P - wpr - 24); der(pr, y, F(600, 26), '#15171c'); y += 32;
    if(i.meses){ izq(plural(i.meses * i.cant, 'mes', 'meses'), y, F(400, 22), '#868d99'); y += 42; } else y += 10;
  });
  const dif = Math.round((totalVenta(v) - its.reduce((a,i) => a + i.precio * i.cant, 0)) * 100) / 100;
  if(v.items && Math.abs(dif) > 0.004){ izq(dif < 0 ? 'Descuento' : 'Ajuste', y, F(500, 24), '#525a68'); der((dif < 0 ? '−' : '+') + fmtEn(Math.abs(dif), m), y, F(500, 24), '#525a68'); y += 40; }
  y += 2; raya(y); y += 60;
  izq('TOTAL', y, F(800, 36), '#15171c'); der(fmtEn(totalVenta(v), m), y, F(800, 40), '#0f766e'); y += 48;
  if(v.metodo && (!v.fiado || pagadoV(v) > 0)){ izq('Pago: ' + v.metodo, y, F(400, 24), '#525a68'); y += 38; }
  if(v.fiado){ const pa = pagadoV(v), pe = pendienteV(v);
    if(pa > 0){ izq('Abonado', y, F(500, 24), '#525a68'); der(fmtEn(pa, m), y, F(500, 24), '#525a68'); y += 38; }
    if(pe > 0){ izq('Saldo pendiente', y, F(700, 27), '#b91c1c'); der(fmtEn(pe, m), y, F(700, 27), '#b91c1c'); y += 38; if(v.promesa){ izq('Pagará el ' + fechaLarga(v.promesa), y, F(400, 22), '#868d99'); y += 36; } }
    else { izq('✓ Pagado completo', y, F(650, 24), '#15803d'); y += 38; } }
  if(v.hasta){ izq('✓ Activo hasta el ' + fechaLarga(v.hasta), y, F(650, 26), '#15803d'); y += 42; }
  const acL = conAcceso ? accesoTexto(accesoVenta(v)) : [];
  if(acL.length){ y += 6; raya(y); y += 50; izq('🔐 Datos de acceso', y, F(700, 27), '#15171c'); y += 42; acL.forEach(t => { x.font = F(500, 24); let r = t; while(r.length){ let n = r.length; while(n > 1 && x.measureText(r.slice(0, n)).width > W - 2 * P) n--; izq(r.slice(0, n), y, F(500, 24), '#15171c'); y += 34; r = r.slice(n); } y += 4; }); }
  y += 26; x.font = F(400, 23); x.fillStyle = '#868d99'; x.textAlign = 'center'; x.fillText('¡Gracias por tu compra!', W / 2, y); y += P;
  const out = document.createElement('canvas'); out.width = W; out.height = y; out.getContext('2d').drawImage(c, 0, 0);
  return out;
}
const blobDe = (cv, tipo, q) => new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('imagen')), tipo, q));
const imagenRecibo = (v, conAcceso) => blobDe(canvasRecibo(v, conAcceso), 'image/png');
function pdfDeJpeg(jpg, w, h){   // PDF de una pagina con la imagen (hecho a mano, sin librerias)
  const W = 420, H = Math.round(420 * h / w), enc = new TextEncoder(), partes = [], offs = [];
  let largo = 0;
  const add = x => { const b = typeof x === 'string' ? enc.encode(x) : x; partes.push(b); largo += b.length; };
  const obj = (n, cuerpo) => { offs[n] = largo; add(n + ' 0 obj\n'); cuerpo(); add('\nendobj\n'); };
  add('%PDF-1.4\n%âãÏÓ\n');
  obj(1, () => add('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => add('<< /Type /Pages /Kids [3 0 R] /Count 1 >>'));
  obj(3, () => add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`));
  obj(4, () => { add(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); add(jpg); add('\nendstream'); });
  const cs = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
  obj(5, () => add(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
  const xref = largo;
  add('xref\n0 6\n0000000000 65535 f \n' + [1, 2, 3, 4, 5].map(n => String(offs[n]).padStart(10, '0') + ' 00000 n \n').join(''));
  add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(partes, {type: 'application/pdf'});
}
async function pdfRecibo(v, conAcceso){
  const cv = canvasRecibo(v, conAcceso), jpg = await blobDe(cv, 'image/jpeg', 0.92);
  return pdfDeJpeg(new Uint8Array(await jpg.arrayBuffer()), cv.width, cv.height);
}

  const volver = () => verCliente(c), pdfP = ult ? pdfRecibo(ult, true) : null;
  if(pdfP) pdfP.catch(() => {});
  $('.ficha').onclick = async ev => { const b = ev.target.closest('[data-cop]'); if(!b) return;
    try{ await navigator.clipboard.writeText(b.dataset.cop); toast('📋 ' + b.dataset.et + ' copiado'); }catch(e){ toast('No se pudo copiar'); } };
  $('#fRen').onclick = () => abrirCobro(c);
  $('#fNo').onclick = () => hacerNoRenovo(c);
  if($('#lFia')) $('#lFia').onclick = ev => { const b = ev.target.closest('[data-pv]'); if(!b) return; const v = S.ventas.find(x => x.id === b.dataset.pv); if(v) abrirPagoVenta(v, volver); };
  $('#fCop').onclick = async () => { try{ await navigator.clipboard.writeText(textoFicha(c)); toast('📋 Datos copiados'); }catch(e){ toast('No se pudo copiar'); } };
  $('#fWa').onclick = () => abrirWa(c.tel, textoFicha(c));
  if(pdfP) $('#fPdf').onclick = async () => { try{ await compartirODescargar(await pdfP, 'recibo-' + (ult.recibo ? String(ult.recibo).padStart(4, '0') : ult.fecha) + '.pdf'); }catch(e){ toast('No se pudo crear el PDF'); } };
  $('#fAv').onclick = () => abrirAviso(c, volver);
  ['#fVC', '#fVC2'].forEach(id => { if($(id)) $(id).onclick = () => abrirVentaCred({cli: c.id, prod: c.prod}); });
  $('#fEd').onclick = () => editarCliente(c);
  if($('#fHist')) $('#fHist').onclick = ev => { const b = ev.target.closest('[data-v]'); if(!b) return; const v = S.ventas.find(x => x.id === b.dataset.v); if(v) abrirRecibo(v, volver); };
  $('#fCer').onclick = cerrarSheet;
}

function editarCliente(c){
  if(!S.productos.length){ abrirProd(null); toast('Primero agrega tu producto y sus paquetes'); return; }
  const nuevo = !c, e = c || {nombre: '', tel: '', prod: S.productos[0].id, paq: '', nota: ''};
  let prodSel = S.productos.some(p => p.id === e.prod) ? e.prod : S.productos[0].id, activar = 'si';
  const prod = () => S.productos.find(x => x.id === prodSel);
  let paqSel = (prod().paquetes.find(k => k.id === e.paq) || prod().paquetes[0]).id;
  const paqChips = () => prod().paquetes.map(k => `<button type="button" class="chip${k.id === paqSel ? ' on' : ''}" data-k="${k.id}"><b>${esc(k.n)}</b><small>${plural(k.cred, 'crédito', 'créditos')} · ${fmtEn(k.precio, monOk(prod().mon))}${(k.meses || 1) > 1 ? ' · ' + k.meses + ' meses' : ''}</small></button>`).join('');
  const est = c ? estadoCli(c) : '';
  const hist = c ? S.ventas.filter(v => v.cli === c.id).sort(ordenG) : [];
  abrirSheet(`<h2>${nuevo ? 'Cliente nuevo' : '✏️ ' + esc(c.nombre)}</h2>
    ${c ? `<div class="cli-est ${est}">${textoEstado(c)}</div>
      <div class="neg-btns"><button class="btn primary" id="lRen">✅ Renovó…</button><button class="btn" id="lNo"${est === 'baja' ? ' disabled' : ''}>❌ No renovó</button></div>${fiadoCliHtml(c)}<div class="neg-btns" style="margin:0 0 4px"><button class="btn" id="lVC">💳 Vender créditos</button><button class="btn" id="lAv">💬 Aviso de vencimiento</button></div>` : ''}
    <div class="lbl2">Nombre</div><input id="lNom" class="inp" placeholder="Nombre del cliente" value="${esc(e.nombre)}" autocomplete="off">
    <div class="lbl2">Teléfono <small>(opcional, para mandarle el recibo por WhatsApp)</small></div><input id="lTel" class="inp" inputmode="tel" placeholder="8888 8888" value="${esc(e.tel || '')}" autocomplete="off">
    ${S.productos.length > 1 ? `<div class="lbl2">Producto</div><div class="chips" id="lProd">${S.productos.map(p => `<button type="button" class="chip${p.id === prodSel ? ' on' : ''}" data-p="${p.id}">${esc(p.nombre)}</button>`).join('')}</div>` : ''}
    ${accesoHtml('l', e)}
    ${nuevo ? `<div class="lbl2">¿Ya te pagó?</div><div class="seg" id="lAct"><button type="button" data-a="si" class="on">✅ Sí, cobrar y activar</button><button type="button" data-a="no">Ya estaba activo</button></div>
      <div id="lCobro">${cobroHtml('l')}</div>
      <div id="lSinCobro" hidden><div class="lbl2">Paquete</div><div class="paq-chips" id="lPaq">${paqChips()}</div>
        <div class="lbl2">Vence el</div><input id="lVen" class="inp" type="date" value="${iso(addMeses(new Date(), 1))}"></div>`
      : `<div class="lbl2">Paquete <small>el que renueva normalmente</small></div><div class="paq-chips" id="lPaq">${paqChips()}</div>
      <div class="lbl2">Vence el</div><input id="lVen" class="inp" type="date" value="${esc(c.vence || '')}">`}
    <input id="lNota" class="inp" placeholder="Nota (opcional)" value="${esc(e.nota || '')}" style="margin-top:12px">
    ${hist.length ? `<div class="lbl2">Pagos <small>toca uno para ver o enviar su recibo</small></div><div class="hist" id="lHist">${hist.slice(0, 36).map(v => `<button type="button" data-v="${v.id}"><span>${fechaCorta(v.fecha)} ${v.fecha.slice(0,4)}</span><span>${esc(v.paqN || '')}${v.metodo ? ' · ' + esc(v.metodo) : ''}${nFotos(v)}${pendienteV(v) > 0 ? ' · 📝 debe ' + fmtEn(pendienteV(v), monOk(v.mon)) : ''}</span><b>${fmtEn(totalVenta(v), monOk(v.mon))} 🧾</b></button>`).join('')}</div>` : ''}
    <div class="err" id="lErr"></div>
    <button class="btn primary" id="lOk">Guardar</button>
    ${c ? '<button class="btn danger" id="lDel">Eliminar cliente</button>' : ''}
    <button class="btn ghost" id="lNo2">Cancelar</button>`);
  const cob = nuevo ? ligarCobro('l', prod, [{paq: paqSel, cant: 1}], () => hoy()) : null;
  const accFotos = fotosDe(e), getAcc = ligarAcceso('l', accFotos);
  if($('#lProd')) $('#lProd').onclick = ev => { const b = ev.target.closest('[data-p]'); if(!b) return; prodSel = b.dataset.p; marcarChip($('#lProd'), 'p', prodSel);
    paqSel = prod().paquetes[0].id; $('#lPaq').innerHTML = paqChips(); if(cob) cob.reset([{paq: paqSel, cant: 1}]); };
  $('#lPaq').onclick = ev => { const b = ev.target.closest('[data-k]'); if(!b) return; paqSel = b.dataset.k; marcarChip($('#lPaq'), 'k', paqSel); };
  if($('#lAct')) $('#lAct').onclick = ev => { const b = ev.target.closest('[data-a]'); if(!b) return; activar = b.dataset.a; marcarChip($('#lAct'), 'a', activar);
    $('#lCobro').hidden = activar !== 'si'; $('#lSinCobro').hidden = activar === 'si'; };
  if($('#lFia')) $('#lFia').onclick = ev => { const b = ev.target.closest('[data-pv]'); if(!b) return; const v = S.ventas.find(x => x.id === b.dataset.pv); if(v) abrirPagoVenta(v, () => abrirCliente(c)); };
  if($('#lVC')) $('#lVC').onclick = () => abrirVentaCred({cli: c.id, prod: c.prod});
  if($('#lAv')) $('#lAv').onclick = () => abrirAviso(c, () => abrirCliente(c));
  if($('#lHist')) $('#lHist').onclick = ev => { const b = ev.target.closest('[data-v]'); if(!b) return; const v = S.ventas.find(x => x.id === b.dataset.v); if(v) abrirRecibo(v, () => abrirCliente(c)); };
  const tomar = () => {   // pasa lo escrito al cliente (sin guardar todavia)
    const nombre = $('#lNom').value.trim().slice(0, 60);
    if(!nombre){ $('#lErr').textContent = 'Escribe el nombre del cliente.'; $('#lNom').focus(); return null; }
    const paq = nuevo && activar === 'si' ? ((cob.get().items[0] || {}).paq || paqSel) : paqSel;
    return Object.assign({nombre, tel: $('#lTel').value.trim().slice(0, 30), prod: prodSel, paq, nota: $('#lNota').value.trim().slice(0, 120), fotos: accFotos.slice()}, getAcc());
  };
  $('#lNo2').onclick = () => c ? verCliente(c) : cerrarSheet();
  if(c){
    $('#lRen').onclick = () => { const d = tomar(); if(!d) return; Object.assign(c, d); const ven = $('#lVen').value; if(reFecha.test(ven)) c.vence = ven; save(); abrirCobro(c); };
    $('#lNo').onclick = () => hacerNoRenovo(c);
    $('#lDel').onclick = () => {
      if(!confirm(`¿Eliminar a ${c.nombre}?\n\nSus ventas ya anotadas se quedan.`)) return;
      const i = S.clientes.indexOf(c); if(i < 0) return;
      S.clientes.splice(i, 1); save(); cerrarSheet(); render();
      toast('Cliente eliminado', () => { S.clientes.splice(i, 0, c); save(); render(); });
    };
  }
  $('#lOk').onclick = () => {
    const d = tomar(); if(!d) return;
    if(S.clientes.some(x => x !== c && norm(x.nombre) === norm(d.nombre)) && !confirm(`Ya tienes un cliente llamado «${d.nombre}». ¿Guardar otro con el mismo nombre?`)) return;
    if(c){
      const ven = $('#lVen').value;
      Object.assign(c, d); if(reFecha.test(ven)) c.vence = ven; actualizarAccesoUltima(c);
      save(); render(); verCliente(c); toast('Cambios guardados'); return;
    }
    const nc = Object.assign({id: uid(), creado: Date.now(), vence: null}, d);
    if(activar === 'no'){
      const ven = $('#lVen').value;
      if(!reFecha.test(ven)){ $('#lErr').textContent = 'Elige hasta cuándo está activo.'; return; }
      nc.vence = ven; S.clientes.push(nc); save(); cerrarSheet(); render(); toast('👤 ' + nc.nombre + ' agregado'); return;
    }
    const cb = cob.get(), n = cob.cred(), p = prod();
    if(!cb.items.length){ $('#lErr').textContent = 'Agrega al menos un paquete.'; return; }
    if(!(cb.total >= 0)){ $('#lErr').textContent = 'Escribe el total a cobrar.'; return; }
    if(!AYU && p.stock < n && !confirm(`Te quedan ${plural(p.stock, 'crédito', 'créditos')} de ${p.nombre} y esto usa ${n}.\n\n¿Activarlo igual? (quedará en negativo hasta que anotes la compra de créditos)`)) return;
    S.clientes.push(nc);
    const r = registrarRenovacion(nc, hoy(), cb);
    save(); render(); abrirRecibo(r.v, () => verCliente(nc));
    toast(`👤 ${nc.nombre} activo hasta ${fechaCorta(nc.vence)} · −${plural(n, 'crédito', 'créditos')} ${AYU ? '' : '(quedan ' + p.stock + ')'}`, () => {
      deshacerRenovacion(nc, r); const i = S.clientes.indexOf(nc); if(i >= 0) S.clientes.splice(i, 1); save(); render(); cerrarSheet(); });
  };
  if(nuevo) setTimeout(() => $('#lNom') && $('#lNom').focus(), 120);
}

/* Pagado / Fiado */
function pagoHtml(x){
  return `<div class="lbl2">¿Pagó?</div><div class="seg" id="${x}Pg"><button type="button" data-pg="si" class="on">✅ Pagado</button><button type="button" data-pg="fiado">📝 Fiado</button></div>
    <div id="${x}Fi" hidden><div class="dos"><div><div class="lbl2">Abonó ahora <small>(opcional)</small></div><input id="${x}Ab" class="inp" inputmode="decimal" placeholder="0"></div>
      <div><div class="lbl2">Pagará el <small>(opcional)</small></div><input id="${x}Pr" class="inp" type="date"></div></div></div>
    <input id="${x}PN" class="inp" placeholder="Nota (opcional): cuándo o cómo paga…" style="margin-top:12px" autocomplete="off">`;
}
function ligarPago(x){
  let pg = 'si';
  $('#' + x + 'Pg').onclick = ev => { const b = ev.target.closest('[data-pg]'); if(!b) return; pg = b.dataset.pg; marcarChip($('#' + x + 'Pg'), 'pg', pg); $('#' + x + 'Fi').hidden = pg !== 'fiado'; };
  return () => ({fiado: pg === 'fiado', abono: parseMonto($('#' + x + 'Ab').value) || 0, promesa: $('#' + x + 'Pr').value, nota: $('#' + x + 'PN').value.trim().slice(0, 160)});
}
function aplicarPagoEstado(v, pg, metodo){
  if(pg.nota) v.nota = pg.nota;
  if(!pg.fiado) return;
  v.fiado = true; v.pagos = [];
  if(pg.abono > 0) v.pagos.push({id: uid(), monto: Math.min(pg.abono, totalVenta(v)), fecha: v.fecha, ...(metodo ? {metodo} : {})});
  if(reFecha.test(pg.promesa)) v.promesa = pg.promesa;
}
function fiadoCliHtml(c){
  const ds = S.ventas.filter(v => v.cli === c.id && pendienteV(v) > 0).sort(ordenG);
  if(!ds.length) return '';
  return `<div class="lbl2">📝 Fiado <small>debe ${fmt(deudaCli(c))}</small></div><div class="fiados" id="lFia">${ds.map(v => `<div class="fia"><span><b>${fechaCorta(v.fecha)}</b> · ${esc(v.paqN || v.nom)}${v.promesa ? '<br><small>pagará el ' + fechaCorta(v.promesa) + '</small>' : ''}${v.nota ? '<br><small>' + esc(v.nota) + '</small>' : ''}</span><b>${fmtEn(pendienteV(v), monOk(v.mon))}</b><button type="button" class="btn small primary" data-pv="${v.id}">💵 Pagó</button></div>`).join('')}</div>`;
}
function abrirPagoVenta(v, volver){
  const m = monOk(v.mon), pend = pendienteV(v); let metodo = 'Efectivo';
  abrirSheet(`<h2>Pago de ${esc(v.cliente || v.nom)}</h2>
    <p class="hint" style="margin-top:0">${esc(v.nom)}${v.paqN ? ' · ' + esc(v.paqN) : ''} · ${fechaCorta(v.fecha)} · debe ${fmtEn(pend, m)} de ${fmtEn(totalVenta(v), m)}</p>
    <label class="monto"><span>${esc(m)}</span><input id="gMonto" inputmode="decimal" placeholder="0" autocomplete="off"></label>
    <button type="button" class="link" id="gTodo" style="margin-top:0">Pagó todo (${fmtEn(pend, m)})</button>
    <div class="lbl2">Método de pago</div><div class="seg" id="gMet">${METODOS_COBRO.map(x => `<button type="button" data-m="${x}" class="${x === metodo ? 'on' : ''}">${x}</button>`).join('')}</div>
    <div class="lbl2">Fecha</div><input id="gFec" class="inp" type="date" value="${hoy()}" max="${hoy()}">
    <input id="gNota" class="inp" placeholder="Nota (opcional)" style="margin-top:12px" autocomplete="off">
    ${fotosHtml('g')}<div class="ocr" id="gOcr"></div>
    <div class="err" id="gErr"></div>
    <button class="btn primary" id="gOk">Guardar pago</button>
    <button class="btn ghost" id="gNo">${volver ? '‹ Volver' : 'Cancelar'}</button>`);
  $('#gTodo').onclick = () => { $('#gMonto').value = pend; };
  const gFotos = [];
  ligarFotos('g', gFotos, ligarOcrMonto('g', gFotos, (t, mo, det) => { const val = mo && mo !== m ? convMon(t, mo, m) : t; $('#gMonto').value = val;
    $('#gOcr').textContent = '📷 Leí ' + (det ? det + ' = ' : '') + fmtEn(t, mo || m) + (mo && mo !== m ? ' (= ' + fmtEn(val, m) + ')' : '') + ' en ' + (det ? 'las fotos' : 'la foto'); }));
  $('#gMet').onclick = ev => { const b = ev.target.closest('[data-m]'); if(b){ metodo = b.dataset.m; marcarChip($('#gMet'), 'm', metodo); } };
  $('#gNo').onclick = () => volver ? volver() : cerrarSheet();
  $('#gOk').onclick = () => {
    const monto = parseMonto($('#gMonto').value), fecha = $('#gFec').value, nota = $('#gNota').value.trim().slice(0, 160);
    if(!(monto > 0)){ $('#gErr').textContent = 'Escribe cuánto pagó.'; $('#gMonto').focus(); return; }
    if(!reFecha.test(fecha)){ $('#gErr').textContent = 'Elige la fecha.'; return; }
    if(monto > pend + 0.001 && !confirm(`Debía ${fmtEn(pend, m)} y anotaste ${fmtEn(monto, m)}. ¿Guardar igual?`)) return;
    (v.pagos = v.pagos || []).push({id: uid(), monto, fecha, metodo, ...(nota ? {nota} : {}), ...(gFotos.length ? {fotos: gFotos.slice()} : {})});
    save(); render(); volver ? volver() : cerrarSheet();
    toast(pendienteV(v) <= 0 ? '✓ ' + (v.cliente || 'El cliente') + ' pagó todo' : '💵 Pago anotado · debe ' + fmtEn(pendienteV(v), m));
  };
  setTimeout(() => $('#gMonto') && $('#gMonto').focus(), 120);
}

function abrirVenta(v){   // corregir una venta ya anotada, ver su recibo y sus pagos
  const m = monOk(v.mon), fotosSel = fotosDe(v); let metodo = v.metodo || '', pg = v.fiado ? 'fiado' : 'si';
  const pe = pendienteV(v);
  abrirSheet(`<h2>Venta ${numRecibo(v)}</h2>
    <p class="hint" style="margin-top:0">${esc(v.nom)}${v.paqN ? ' · ' + esc(v.paqN) : ''} · ${fechaCorta(v.fecha)}</p>
    ${v.fiado ? `<div class="cli-est ${pe > 0 ? 'vencido' : ''}">${pe > 0 ? '📝 Fiado · debe ' + fmtEn(pe, m) + (v.promesa ? ' · pagará el ' + fechaCorta(v.promesa) : '') : '✅ Fiado ya pagado completo'}</div>
      ${pe > 0 ? '<button class="btn primary" id="vPag" style="margin:0 0 6px">💵 Anotar pago</button>' : ''}
      ${(v.pagos || []).length ? `<div class="lbl2">Pagos</div><div class="abonos" id="vPagos">${v.pagos.map(p => `<div class="abono"><span>${fechaCorta(p.fecha)}${p.metodo ? ' · ' + esc(p.metodo) : ''}${p.nota ? '<br><small>' + esc(p.nota) + '</small>' : ''}</span><b>${fmtEn(p.monto, m)}</b><button type="button" data-pa="${esc(p.id)}" aria-label="Quitar pago">✕</button></div>`).join('')}</div>` : ''}` : ''}
    <button class="btn" id="vRec" style="margin:6px 0 4px">🧾 Ver y enviar recibo</button>
    <div class="lbl2">Cliente</div><input id="vCli" class="inp" value="${esc(v.cliente || '')}" autocomplete="off">
    <div class="dos"><div><div class="lbl2">Créditos usados</div><input id="vCant" class="inp" inputmode="numeric" value="${esc(v.cant)}"></div>
      <div><div class="lbl2">Total (${esc(m)})</div><input id="vTot" class="inp" inputmode="decimal" value="${esc(totalVenta(v))}"></div></div>
    <div class="lbl2">Método de pago</div><div class="seg" id="vMet">${METODOS_COBRO.map(x => `<button type="button" data-m="${x}" class="${x === metodo ? 'on' : ''}">${x}</button>`).join('')}</div>
    <div class="lbl2">¿Pagó?</div><div class="seg" id="vPg"><button type="button" data-pg="si" class="${pg === 'si' ? 'on' : ''}">✅ Pagado</button><button type="button" data-pg="fiado" class="${pg === 'fiado' ? 'on' : ''}">📝 Fiado</button></div>
    <div class="lbl2">Fecha</div><input id="vFec" class="inp" type="date" value="${v.fecha}" max="${hoy()}">
    <input id="vNota" class="inp" placeholder="Nota (opcional)" value="${esc(v.nota || '')}" style="margin-top:12px" autocomplete="off">
    ${fotosHtml('v')}
    <div class="err" id="vErr"></div>
    <button class="btn primary" id="vOk">Guardar</button>
    <button class="btn danger" id="vDel">Eliminar venta</button>
    <button class="btn ghost" id="vNo">Cancelar</button>`);
  ligarFotos('v', fotosSel);
  $('#vMet').onclick = ev => { const b = ev.target.closest('[data-m]'); if(b){ metodo = b.dataset.m; marcarChip($('#vMet'), 'm', metodo); } };
  $('#vPg').onclick = ev => { const b = ev.target.closest('[data-pg]'); if(b){ pg = b.dataset.pg; marcarChip($('#vPg'), 'pg', pg); } };
  $('#vRec').onclick = () => abrirRecibo(v, () => abrirVenta(v));
  if($('#vPag')) $('#vPag').onclick = () => abrirPagoVenta(v, () => abrirVenta(v));
  if($('#vPagos')) $('#vPagos').onclick = ev => { const b = ev.target.closest('[data-pa]'); if(!b) return;
    const p = v.pagos.find(x => x.id === b.dataset.pa); if(!p || !confirm(`¿Quitar el pago de ${fmtEn(p.monto, m)} del ${fechaCorta(p.fecha)}?`)) return;
    v.pagos = v.pagos.filter(x => x !== p); save(); render(); abrirVenta(v); toast('Pago quitado'); };
  $('#vNo').onclick = cerrarSheet;
  $('#vOk').onclick = () => {
    const cant = entero($('#vCant').value), total = parseMonto($('#vTot').value), fecha = $('#vFec').value;
    if(!(cant > 0)){ $('#vErr').textContent = 'Escribe cuántos créditos usó.'; return; }
    if(!(total >= 0)){ $('#vErr').textContent = 'Escribe el total.'; return; }
    if(!reFecha.test(fecha)){ $('#vErr').textContent = 'Elige la fecha.'; return; }
    const p = S.productos.find(x => x.id === v.prod); if(p) p.stock += v.cant - cant;
    Object.assign(v, {cliente: $('#vCli').value.trim().slice(0, 60), cant, total, fecha, fotos: fotosSel.slice()}); delete v.precio;
    if(v.items && v.items.length === 1 && v.tipo === 'creditos') v.items = [{n: plural(cant, 'crédito', 'créditos'), cant: 1, precio: total, meses: 0, cred: cant}], v.paqN = plural(cant, 'crédito', 'créditos');
    if(metodo) v.metodo = metodo;
    const nota = $('#vNota').value.trim().slice(0, 160); if(nota) v.nota = nota; else delete v.nota;
    if(pg === 'fiado'){ if(!v.fiado){ v.fiado = true; v.pagos = v.pagos || []; } } else { delete v.fiado; delete v.promesa; }
    save(); cerrarSheet(); render(); toast('Cambios guardados');
  };

/* ================= Toast ================= */
let toastT;
function toast(msg, deshacer){
  const t = $('#toast');
  t.innerHTML = `<span>${msg}</span>` + (deshacer ? '<button id="tUndo">Deshacer</button>' : '');
  t.hidden = false;
  if(deshacer) $('#tUndo').onclick = () => { deshacer(); t.hidden = true; };
  clearTimeout(toastT);
  toastT = setTimeout(() => t.hidden = true, deshacer ? 5000 : 2200);
}

/* ================= Respaldo ================= */
async function compartirODescargar(blob, name){
  try{
    const file = new File([blob], name, {type: blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:name}); return true; }
  }catch(e){ if(e && e.name === 'AbortError') return false; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
async function exportar(){

  const ok = await compartirODescargar(new Blob([data], {type:'application/json'}), `gastos-respaldo-${hoy()}.json`);
  if(ok){ S.ajustes.ultimoRespaldo = hoy(); save(); render(); toast('💾 Respaldo listo' + (nf ? ' (con ' + nf + ' fotos)' : '') + (faltan ? ' · ' + faltan + ' fotos no se pudieron leer' : '')); }
}

    case 'exportar': exportar(); break;
    case 'importar': $('#fileImp').click(); break;
    case 'csv': exportarCSV(); break;
    case 'editCat': { const c = CATS.find(x => x.id === b.dataset.id); if(c) abrirCat(c); break; }
    case 'nuevaCat': abrirCat(null); break;
    case 'catsFabrica':
      if(confirm('¿Volver a las categorías de fábrica?\n\nLas que agregaste se quitan y sus compras pasan a «Otros». Los nombres e íconos que cambiaste vuelven a ser los de antes.')){
        const ids = new Set(CATS_FABRICA.map(c => c.id));
        S.gastos.forEach(g => { if(!ids.has(g.cat)) g.cat = 'otros'; }); S.fijos.forEach(f => { if(!ids.has(f.cat)) f.cat = 'otros'; });
        delete S.ajustes.cats; cargarCats(); save(); render(); toast('Categorías de fábrica');
      }
      break;
    case 'tema': { const osc = temaOscuro(); S.ajustes.tema = osc ? 'light' : 'dark'; save(); render(); toast(osc ? '☀️ Modo día' : '🌙 Modo noche'); break; }
    case 'borrarTodo':
      if(confirm('¿Borrar TODAS las compras, ingresos, fijos, negocio, clientes, préstamos, metas, deudas y fotos de este teléfono?\n\nSi no tienes respaldo, no se pueden recuperar.') && confirm('¿Seguro? Esto no se puede deshacer.')){
        const a = S.ajustes; S = defaults(); S.ajustes = Object.assign(S.ajustes, {moneda:a.moneda, umbral:a.umbral, presupuesto:a.presupuesto, tema:a.tema, cats:a.cats, ingcats:a.ingcats, tasa:a.tasa});
        save(); render(); toast('Todo borrado'); fotoOp('readwrite', st => st.clear()).catch(() => {});
      }
      break;
  }
});
document.addEventListener('input', ev => {
  if(ev.target.id === 'buscar'){ busqueda = ev.target.value; llenarLista(); }
  if(ev.target.id === 'buscarCli'){ const q = norm(ev.target.value); document.querySelectorAll('#main .cli').forEach(el => { el.hidden = !!q && !(el.dataset.n || '').includes(q); }); }
});
document.addEventListener('change', ev => {
  const k = ev.target.dataset && ev.target.dataset.set;
  if(!k) return;
  let v = ev.target.value;
  if(k === 'umbral' || k === 'presupuesto'){ v = parseMonto(v); if(!(v >= 0)) v = 0; }
  if(k === 'tasa'){ v = parseMonto(v); if(!(v > 0)){ toast('Escribe una tasa mayor que 0'); render(); return; } }
  S.ajustes[k] = v; save(); render(); toast('Guardado');
});
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && !$('#fotoVer').hidden){ $('#fotoVer').hidden = true; return; }
  if(ev.key === 'Escape' && !$('#sheetWrap').hidden) cerrarSheet();
  if(ev.key === 'Enter' && (ev.target.id === 'fDesc' || ev.target.id === 'iDesc')){ ev.preventDefault(); const m = $('#fMonto') || $('#iMonto'); if(m) m.focus(); return; }
  if(ev.key === 'Enter' && ev.target.closest && ev.target.closest('#sheet') && ev.target.tagName === 'INPUT' && ev.target.type !== 'date'){
    const ok = $('#fOk') || $('#xOk') || $('#iOk') || $('#yOk') || $('#pOk') || $('#vOk') || $('#cOk') || $('#rOk') || $('#aOk'); if(ok){ ev.preventDefault(); ok.click(); }
  }
});
// Si la app queda abierta de un día para otro, refresca "hoy"
document.addEventListener('visibilitychange', () => { if(!document.hidden && $('#sheetWrap').hidden) render(); });

render();
bloquear();
setTimeout(limpiarFotosSueltas, 4000);
setTimeout(iniciarNube, 1200);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
