<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Mis Gastos</title>
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#15171c; --ink2:#525a68; --muted:#868d99; --line:#e2e5ea;
  --accent:#0f766e; --on-accent:#ffffff; --accent-soft:#dcf1ed; --bar:#14857b; --track:#edf0f2;
  --good:#15803d; --good-soft:#dcfce7; --warn:#a16207; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1014; --card:#171a20; --ink:#eef0f3; --ink2:#aab0bb; --muted:#7b828f; --line:#262b33;
    --accent:#2dd4bf; --on-accent:#05201c; --accent-soft:#113a35; --bar:#2bb3a3; --track:#232830;
    --good:#4ade80; --good-soft:#12301d; --warn:#fbbf24; --warn-soft:#352a0c; --bad:#f87171; --bad-soft:#3a1616;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1014; --card:#171a20; --ink:#eef0f3; --ink2:#aab0bb; --muted:#7b828f; --line:#262b33;
  --accent:#2dd4bf; --on-accent:#05201c; --accent-soft:#113a35; --bar:#2bb3a3; --track:#232830;
  --good:#4ade80; --good-soft:#12301d; --warn:#fbbf24; --warn-soft:#352a0c; --bad:#f87171; --bad-soft:#3a1616;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:contain}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.num,.amt,.big,.bv{font-variant-numeric:tabular-nums}

header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:21px;margin:0;font-weight:750;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.apretado h1{font-size:17px}
header.apretado .mesnav span{min-width:100px}
.mesnav{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px}
.mesnav button{width:36px;height:36px;border:0;background:none;font-size:22px;line-height:1;border-radius:50%}
.mesnav button:disabled{opacity:.25}
.mesnav span{font-size:14px;font-weight:650;min-width:120px;text-align:center;text-transform:capitalize}

main{padding:2px 16px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:500;color:var(--muted);font-size:13px}
.lbl{font-size:13px;color:var(--ink2)}
.big{font-size:36px;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px}
.split{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink2)}
.split b{color:var(--ink)}
.proy{margin-top:10px;font-size:13px;color:var(--ink2)}

.pbar{height:10px;background:var(--track);border-radius:6px;overflow:hidden;margin-top:14px}
.pbar i{display:block;height:100%;border-radius:6px;background:var(--good)}
.pbar.warn i{background:var(--warn)} .pbar.bad i{background:var(--bad)}
.ptxt{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:6px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 10px 9px;box-shadow:var(--shadow);min-width:0}
.stat small{display:block;font-size:11.5px;color:var(--muted);line-height:1.2}
.stat b{display:block;font-size:15.5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat em{font-style:normal;font-size:12px;font-weight:650}
.up{color:var(--bad)} .down{color:var(--good)}

.ant{background:var(--warn-soft);border-color:transparent;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.ant .e{font-size:30px}
.ant b{font-size:18px}
.ant p,.ant .p{display:block;margin:2px 0 0;font-size:13.5px;color:var(--ink2)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip small{color:var(--muted);margin-left:4px}
.chip.on small{color:inherit;opacity:.8}

.bars{display:flex;flex-direction:column;gap:12px}
.barrow{display:grid;grid-template-columns:1fr auto;gap:5px 8px;border:0;background:none;padding:0;text-align:left;width:100%}
.bl{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bv{font-size:14px;font-weight:650}
.bv small{font-weight:500;color:var(--muted);margin-left:4px}
.bt{grid-column:1/3;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--bar);border-radius:4px}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 0;text-align:left;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.item .ico{width:40px;height:40px;flex:none;border-radius:12px;background:var(--track);display:grid;place-items:center;font-size:20px}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .txt small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:700;font-size:15px;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.item .amt small{font-weight:500;font-size:12px;color:var(--muted)}
.item.off{opacity:.5}
.dia{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-weight:650;margin:16px 4px 4px}
.dia:first-child{margin-top:4px}

.inp{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.inp:focus{border-color:var(--accent)}
select.inp{appearance:none;-webkit-appearance:none}
.search{margin-bottom:12px}
.filtro{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:14px}
.filtro button{border:0;background:none;font-weight:700;color:var(--accent)}
.foot{font-size:13px;color:var(--muted);text-align:center;margin:12px 0}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:650;margin-top:10px;background:var(--track)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:none;color:var(--ink2)}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13.5px;padding:0;margin-top:12px}

.aviso{border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.aviso.warn{background:var(--warn-soft)} .aviso.bad{background:var(--bad-soft)}
.empty{text-align:center;color:var(--ink2);padding:20px 8px}
.empty .e{font-size:40px}
.pasos{text-align:left;margin:12px auto 0;padding-left:20px;max-width:360px;font-size:14.5px}
.pasos li{margin-bottom:6px}

.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow label{font-size:15px}
.setrow label small{display:block;color:var(--muted);font-size:12.5px}
.setrow .inp{width:130px;text-align:right;padding:10px 12px}
.setrow select.inp{text-align:left}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600}
.tabs button.on{color:var(--accent)}
.tabs svg{width:24px;height:24px}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;width:62px;height:62px;border-radius:50%;
  border:0;background:var(--accent);color:var(--on-accent);font-size:34px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.28)}

.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:sube .18s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:18px;margin:0 0 12px}
.monto{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--accent);margin-bottom:14px;padding:4px 2px}
.monto span{font-size:22px;color:var(--ink2);font-weight:650}
.monto input{flex:1;min-width:0;border:0;background:none;outline:none;font:inherit;font-size:38px;font-weight:800;color:var(--ink);padding:4px 0}
.lbl2{font-size:13px;color:var(--ink2);font-weight:650;margin:14px 0 7px}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:10px 4px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sheet .inp{margin-top:2px}
.sheet #fNota,.sheet #iNota{margin-top:12px}
.err{color:var(--bad);font-size:14px;min-height:0;margin-top:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:30;
  background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 16px;font-size:14.5px;display:flex;gap:14px;align-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--accent);font-weight:750;padding:0}
:root:not([data-theme="dark"]) .toast button{color:#5eead4}

.grp{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp .txt{flex:1;min-width:0}
.grp .txt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .txt small{color:var(--muted);font-size:12.5px}
.grp .amt{text-align:right}
.grp .amt b{display:block;font-size:15px}
.grp .amt small{color:var(--muted);font-size:12px}
.grp .x{border:0;background:var(--track);border-radius:8px;font-size:11.5px;padding:5px 8px;color:var(--ink2);margin-top:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--bad-soft);color:var(--bad);margin-left:4px;vertical-align:1px}
.tip{background:var(--accent-soft);border-color:transparent;font-size:14.5px}

/* ===== 23/11/2026 (Jesser): todo fijo en el celular. La pagina no se mueve: solo el contenido se desliza hacia arriba
   y abajo (nunca de lado), sin la linea de desplazamiento a la derecha. ===== */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-bottom:0;touch-action:pan-y}
header{position:relative;flex:none}
main#main{flex:1 1 auto;min-height:0;width:100%;max-width:none;margin:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none;
  padding:2px max(16px, calc((100% - 640px) / 2)) calc(150px + env(safe-area-inset-bottom))}
main#main::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none;width:0;height:0}
.sheet{scrollbar-width:none;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y}
/* modo dia y noche, arriba a la derecha */
.hdr-der{display:flex;align-items:center;gap:8px;flex:none}
.tema-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:19px;line-height:1;
  display:grid;place-items:center;padding:0}
/* categorias: por grupos, en cuadricula pareja de 3 */
.chips:has(> .cats-g){display:block}
.cats-g{display:grid;gap:8px}
.cats-t{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.cats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.cats-grid .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:64px;padding:8px 4px;
  border-radius:14px;white-space:normal;text-align:center;font-size:12.5px;line-height:1.2;overflow-wrap:anywhere}
.cats-grid .chip .ce{font-size:21px;line-height:1}
/* Ajustes: cuenta y guia */
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
.guia details{border-top:1px solid var(--line);padding:11px 0}
.guia details:first-of-type{border-top:0;padding-top:2px}
.guia summary{font-weight:650;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px}
.guia summary::-webkit-details-marker{display:none}
.guia summary::after{content:'+';color:var(--muted);font-weight:500}
.guia details[open] summary::after{content:'–'}
.guia p,.guia li{margin:8px 0 0;font-size:14px;line-height:1.45;color:var(--ink2)}
.guia ol{margin:0;padding-left:20px}

/* categorias en Ajustes (23/11/2026) */
.cat-lista{display:grid;gap:6px;margin:6px 0 4px}
.cat-fila{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;align-items:center;gap:8px;width:100%;padding:10px 12px;
  border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left}
.cat-fila .ce{font-size:20px;text-align:center}
.cat-fila .cn{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-fila .cu{font-size:12px;color:var(--muted)}
.cat-fila .ed{font-size:13px;color:var(--accent);font-weight:650}
.emo-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.emo-grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;font-size:20px;padding:0;min-width:0}
.emo-grid button.on{border-color:var(--accent);background:var(--accent-soft)}
#kEmoTxt{margin-top:8px}
#kGrp .chip{min-height:46px}

/* dos monedas (23/11/2026) */
.mon-seg{margin-bottom:8px}
.mon-seg button{font-size:13.5px}
.conv{font-size:13px;color:var(--muted);margin:-8px 0 12px;min-height:0}
.conv:empty{display:none}

/* ingresos y fotos (23/11/2026) */
.item.ing .amt{color:var(--good)}
.item.ing .amt small{color:var(--muted)}
.item.ing .ico{background:var(--good-soft)}
.big.pos{color:var(--good)}
.big.neg{color:var(--bad)}
.ingv{font-style:normal;color:var(--good);margin-left:8px}
.mov-seg{margin-bottom:12px}
.seg.tri button{font-size:12.5px;padding:10px 2px}
.ing-add{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px dashed var(--line);color:inherit;font:inherit}
.ing-add>span:first-child{font-size:26px;width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--good-soft)}
.ing-add b{display:block;font-size:15px}
.ing-add small{display:block;color:var(--muted);font-size:12.5px}
.lbl2 small{font-weight:500;color:var(--muted)}
.fotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fth,.fadd{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:var(--track);overflow:hidden;padding:0;position:relative}
.fth img{width:100%;height:100%;object-fit:cover;display:block}
.fth.rota::after{content:'⚠️';position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.fadd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:26px;color:var(--ink2);border-style:dashed}
.fadd span{font-size:12px;font-weight:650}
.fver{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.fver img{flex:1;min-height:0;width:100%;object-fit:contain}
.fver-b{display:flex;gap:10px}
.fver-b .btn{flex:1;margin:0}

/* movimientos y categorias juntas (23/11/2026) */
.cats-grid.cats-todas{display:flex;flex-wrap:wrap;gap:7px}
.cats-grid.cats-todas .chip{flex:1 1 calc((100% - 14px) / 3);max-width:100%}
.ver-seg{margin:10px 0 12px}
.resmov{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;text-align:center;padding:12px 10px}
.resmov small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.resmov b{font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.resmov b.pos{color:var(--good)}
.resmov b.neg{color:var(--bad)}

/* editar categorias desde la hoja (23/11/2026) */
.lbl-row{display:flex;justify-content:space-between;align-items:center}
.lnk{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:2px 0}
.cats-grid .chip{position:relative}
.editando .chip{border-style:dashed;border-color:var(--accent)}
.editando .chip.on{background:var(--card);color:inherit}
.editando .chip:not(.chip-nueva)::after{content:'✏️';position:absolute;top:4px;right:6px;font-size:11px}
.chip-nueva{color:var(--accent);font-weight:700}

/* total de Inicio en C$ o US$ (23/11/2026) */
.seg.mini{padding:2px;gap:2px;border-radius:10px}
.seg.mini button{padding:5px 12px;font-size:13px;flex:none;border-radius:8px}
.tasa-nota{font-size:12px;color:var(--muted);margin-top:2px}

/* negocio y prestamos (23/11/2026) */
.tabs button{font-size:10.5px;letter-spacing:-.01em}
.tabs svg{width:23px;height:23px}
.neg-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.neg-btns .btn{margin:0}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dos .lbl2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dos .inp{width:100%;min-width:0}
b.pos{color:var(--good)}
.rojo{color:var(--bad)}
.deben{display:flex;justify-content:space-between;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:650}
.deben b{font-size:17px}

function fijoAplica(f, ym){

function proximoCobro(f, desdeStr){
  const base = parseD(f.inicio), t = parseD(desdeStr);
  if(base >= t) return f.inicio;
  if(f.frecuencia === 'semanal' || f.frecuencia === 'quincenal'){
    const step = f.frecuencia === 'semanal' ? 7 : 15;
    const diff = Math.round((t - base) / 864e5);
    const d = new Date(base); d.setDate(d.getDate() + Math.ceil(diff/step)*step);
    return iso(d);
  }
  const step = f.frecuencia === 'anual' ? 12 : 1;
  const meses = (t.getFullYear()-base.getFullYear())*12 + (t.getMonth()-base.getMonth());
  let k = Math.max(0, Math.floor(meses/step) - 1);
  let c = addMeses(base, k*step);
  while(c < t){ k++; c = addMeses(base, k*step); }
  return iso(c);
}

/* Ritmo de gastos hormiga: últimos 30 días (o desde el primer gasto si hay menos) */
function ritmoHormiga(){
  const h = hoy();
  const pasados = S.gastos.filter(g => g.fecha <= h);
  if(!pasados.length) return null;
  const t = parseD(h);
  let ini = new Date(t); ini.setDate(ini.getDate() - 29);
  const primera = parseD(pasados.reduce((a,g) => g.fecha < a ? g.fecha : a, pasados[0].fecha));
  if(primera > ini) ini = primera;
  const iniS = iso(ini);
  const dias = Math.round((t - ini) / 864e5) + 1;
  const ventana = pasados.filter(g => g.fecha >= iniS);
  const hor = ventana.filter(esHormiga);
  const map = new Map();
  for(const g of hor){
    const k = claveG(g);
    let o = map.get(k);
    if(!o){ o = {k, nombre: g.desc || cat(g.cat).n, cat: g.cat, veces:0, total:0}; map.set(k, o); }
    o.veces++; o.total += mB(g);
  }
  const a30 = v => v / dias * 30;
  const grupos = [...map.values()].map(o => Object.assign(o, {mensual: a30(o.total), anual: a30(o.total)*12}))
    .sort((a,b) => b.total - a.total);
  const total = sum(hor), totalVar = sum(ventana);
  return {dias, iniS, total, totalVar, veces: hor.length, mensual: a30(total), anual: a30(total)*12, grupos};
}

/* Inversion en creditos (24/11/2026) */
function precioPromCred(p){   // lo que de verdad cobras por credito; si aun no vendes, el de tus paquetes
  const pm = monOk(p.mon), vs = S.ventas.filter(v => v.prod === p.id && +v.cant > 0);
  const cr = vs.reduce((a,v) => a + (+v.cant), 0);
  if(cr > 0) return vs.reduce((a,v) => a + convMon(totalVenta(v), monOk(v.mon), pm), 0) / cr;
  const ks = (p.paquetes || []).filter(k => k.cred > 0);
  return ks.length ? ks.reduce((a,k) => a + k.precio / k.cred, 0) / ks.length : 0;
}
function inversionHtml(){
  if(!S.productos.length) return '';
  let inv = 0, valor = 0; const filas = [];
  S.productos.forEach(p => {
    const pm = monOk(p.mon), st = Math.max(0, +p.stock || 0), i = enB(st * (+p.costo || 0), pm), vv = enB(st * precioPromCred(p), pm);
    inv += i; valor += vv;
    filas.push(`<div class="inv-f"><span>${esc(p.nombre)} · ${plural(st, 'crédito', 'créditos')}</span><b>${fmt(i)}</b><small>≈ +${fmt(vv - i)}</small></div>`);
  });
  const histInv = S.comprasNeg.reduce((a,c) => a + enB(c.cant * c.costo, c.mon), 0), histGan = S.ventas.reduce((a,v) => a + enB(totalVenta(v) - costoVenta(v), v.mon), 0);
  return `<section class="card"><div class="lbl">💼 Invertido en los créditos que tienes</div><div class="big">${fmt(inv)}</div>
    <div class="split"><span>📈 Si los vendes ≈ <b>${fmt(valor)}</b></span><span>💵 Ganancia aprox. <b class="pos">${fmt(valor - inv)}</b></span></div>
    ${S.productos.length > 1 ? `<div class="inv">${filas.join('')}</div>` : ''}
    <div class="proy">Desde que empezaste: compraste ${fmt(histInv)} en créditos y has ganado ${fmt(histGan)} en ventas${histInv > 0 ? ' (' + Math.round(histGan / histInv * 100) + '% de lo invertido)' : ''}.<br><small>El «si los vendes» usa lo que cobras en promedio por crédito.</small></div></section>`;
}

/* ================= Leer fotos en el telefono (23/11/2026): montos de pagos y usuario/contraseña =================
   Tesseract.js corre dentro del navegador; la primera vez baja el lector y el idioma español (~6 MB) y queda guardado.
   Ninguna foto sale del telefono. */
const conFotos = () => S.gastos.concat(S.ingresos, S.prestamos, S.ventas, S.clientes, S.ventas.flatMap(v => v.pagos || []));
let tessP = null, ocrWorkerP = null;
function cargarLector(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(!tessP) tessP = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    sc.onload = () => res(window.Tesseract); sc.onerror = () => { tessP = null; sc.remove(); rej(new Error('sin internet')); }; document.head.appendChild(sc); });
  return tessP;
}
async function leerTexto(data){
  const T = await cargarLector();
  if(!ocrWorkerP){ ocrWorkerP = T.createWorker('spa'); ocrWorkerP.catch(() => { ocrWorkerP = null; }); }
  const r = await (await ocrWorkerP).recognize(data);
  return (r && r.data && r.data.text) || '';
}
function numeroDe(s){
  s = String(s).replace(/\s/g, '');
  const c = s.lastIndexOf(','), p = s.lastIndexOf('.');
  if(c >= 0 && p >= 0){ const dec = c > p ? ',' : '.'; s = s.split(dec === ',' ? '.' : ',').join('').replace(dec, '.'); }
  else if(c >= 0 || p >= 0){ const sep = c >= 0 ? ',' : '.', partes = s.split(sep); s = partes.length === 2 && partes[1].length <= 2 ? partes.join('.') : partes.join(''); }
  const v = parseFloat(s); return isFinite(v) ? v : NaN;
}
function montoDeTexto(t){   // el monto mas probable de un comprobante (palabra clave y/o moneda)
  const L = String(t || '').split(/\n+/).map(l => l.trim()).filter(Boolean);
  const reClave = /(monto|total|importe|cantidad|valor|pagad|pago|transfer|enviad|envi[oó]|debitad|acreditad|abono|dep[oó]sito)/i;
  const reN = /(?:(US\$|USD|U\$|C\$|NIO|C\s\$|\$)\s*)?(\d{1,3}(?:[.,\s]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)(?:\s*(US\$|USD|NIO|C\$|c[oó]rdobas|d[oó]lares))?/gi;
  let mejor = null;
  L.forEach((l, i) => {
    const clave = reClave.test(l) || (i > 0 && reClave.test(L[i - 1]) && !/\d/.test(L[i - 1]));
    let m; reN.lastIndex = 0;
    while((m = reN.exec(l))){
      const raw = m[2], pre = m[1] || '', post = m[3] || '';
      const antes = l.charAt(m.index - 1), despues = l.charAt(m.index + m[0].length);
      if(/[\/:]/.test(antes) || /[\/:-]/.test(despues)) continue;                          // fechas y horas
      if(/^\d{5,}$/.test(raw.replace(/\s/g, '')) && !pre && !post) continue;                 // cuentas y referencias
      const v = numeroDe(raw); if(!(v > 0 && v < 1e7)) continue;
      if(!pre && !post && v >= 1900 && v <= 2100 && !/[.,]/.test(raw)) continue;             // años
      const cur = /US|U\$|D[OÓ]LAR/i.test(pre + post) ? 'US$' : /C\$|C\s\$|NIO|C[OÓ]RDOB/i.test(pre + post) ? 'C$' : pre === '$' ? 'US$' : null;
      const pts = (clave ? 4 : 0) + (cur ? 3 : 0) + (/[.,]\d{2}$/.test(raw) ? 1 : 0);
      if(pts < 3) continue;                                                                  // un numero suelto no se toma
      if(!mejor || pts > mejor.pts || (pts === mejor.pts && v > mejor.monto)) mejor = {monto: Math.round(v * 100) / 100, mon: cur, pts};
    }
  });

function accesoDeTexto(t){   // usuario / contraseña / perfil / pin de una foto o captura
  const L = String(t || '').split(/\n+/).map(l => l.trim().replace(/^[^\p{L}\p{N}]+/u, '')).filter(Boolean), o = {};
  const campos = [['usuario', /^(usuario|user(?:name)?|correo(?:\s+electr[oó]nico)?|e-?mail|cuenta|login)\b/i], ['clave', /^(contrase[ñn]a|contrasena|clave|password|pass(?:word)?|pwd|psw)\b/i],
    ['perfil', /^(perfil|profile|pantalla)\b/i], ['pin', /^(pin)\b/i]];
  L.forEach((l, i) => campos.forEach(([k, re]) => {
    if(o[k]) return;
    const m = l.match(re); if(!m) return;
    let resto = l.slice(m[0].length).replace(/^\s*[:：=\-–]\s*/, '').trim();
    if(!resto && L[i + 1] && !campos.some(([, r2]) => r2.test(L[i + 1]))) resto = L[i + 1].trim();
    if(resto) o[k] = (k === 'clave' || k === 'pin') ? resto.split(/\s+/)[0] : resto;
  }));
  const url = String(t || '').match(/https?:\/\/[^\s"'<>]+/i);
  if(url){ o.m3u = url[0]; const d = datosM3u(url[0]); if(d){ if(d.usuario && !o.usuario) o.usuario = d.usuario; if(d.clave && !o.clave) o.clave = d.clave; } }
  if(!o.usuario){ const e = String(t || '').match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/); if(e) o.usuario = e[0]; }
  if(o.usuario) o.usuario = o.usuario.replace(/\s*(?:Q|©|®|\(a\)|@)\s*(gmail|hotmail|outlook|yahoo|icloud|live|msn|proton(?:mail)?)\s*\.\s*(com|es|net)\b/i, '@$1.$2');   // el lector a veces confunde la @
  Object.keys(o).forEach(k => { o[k] = o[k].slice(0, largoAcc(k)); });
  return o;
}

function balanceHtml(){
  const ahorros = S.metas.reduce((a,m) => a + enB(ahorradoMeta(m), m.mon), 0), deben = teDeben() + teDebenFiado();
  const cred = S.productos.reduce((a,p) => a + enB(Math.max(0, +p.stock || 0) * (+p.costo || 0), monOk(p.mon)), 0), debes = totalDebes(), tot = ahorros + deben + cred - debes;
  if(!(ahorros || deben || cred || debes)) return '';
  return `<section class="card"><h3>📊 Tu balance <small>sin contar efectivo ni cuentas</small></h3>
    ${ahorros ? `<div class="bal"><span>🐷 Ahorrado en metas</span><b>${fmt(ahorros)}</b></div>` : ''}${deben ? `<div class="bal"><span>🤝 Te deben (préstamos y fiado)</span><b>${fmt(deben)}</b></div>` : ''}
    ${cred ? `<div class="bal"><span>📺 Créditos que tienes</span><b>${fmt(cred)}</b></div>` : ''}${debes ? `<div class="bal"><span>🧾 Lo que debes</span><b class="rojo">−${fmt(debes)}</b></div>` : ''}
    <div class="bal tot"><span>${tot >= 0 ? 'A tu favor' : 'En contra'}</span><b class="${tot >= 0 ? 'pos' : 'rojo'}">${fmt(tot)}</b></div></section>`;
}
function vFinanzas(){
  const ym = mesActual(), ing = ingresosTot(ym), gas = gastosTot(ym), qd = ing - gas, tasaAh = ing > 0 ? Math.round(qd / ing * 100) : null;
  let h = `<section class="card"><div class="lbl">Te queda en ${nombreMes(ym)}</div><div class="big ${qd >= 0 ? 'pos' : 'neg'}">${fmt(qd)}</div>
    <div class="split"><span>💰 Entró <b>${fmt(ing)}</b></span><span>💸 Salió <b>${fmt(gas)}</b></span>${tasaAh !== null ? `<span>🏦 Ahorras <b class="${tasaAh >= 0 ? 'pos' : 'rojo'}">${tasaAh}%</b> de lo que entra</span>` : ''}</div></section>`;
  h += `<section class="card"><h3>Últimos 6 meses <small><i class="pto ing"></i> entró <i class="pto gas"></i> salió</small></h3>${graficoMeses(6)}</section>`;
  h += cambiosHtml() + presuHtml();
  h += `<section class="card"><h3>🐷 Metas de ahorro <button class="link" style="margin:0" data-act="nMeta">+ Nueva</button></h3>${S.metas.length ? S.metas.map(metaHtml).join('')
    : '<p class="hint" style="margin:0">Ponte una meta (un viaje, un celular, un fondo de emergencia): cuánto, para cuándo, y ve anotando lo que guardas. Te digo cuánto ahorrar al mes.</p>'}</section>`;
  h += deudasHtml() + balanceHtml();
  const r = ritmoHormiga();
  h += `<button class="card ant" data-act="tab" data-tab="hormiga"><span class="e">🐜</span><span><span class="lbl">Gastos hormiga</span><br><b>${r && r.total > 0 ? fmt(r.mensual) + ' al mes' : 'Ver gastos hormiga'}</b>${r && r.total > 0 ? `<span class="p">≈ ${fmt(r.anual)} al año</span>` : ''}</span></button>`;
  return h;
}

function abrirMeta(m){

    <div class="lbl2">Ícono</div><div class="emo-grid" id="zEmo">${EMO.map(x => `<button type="button" data-emo="${x}" class="${x === emo ? 'on' : ''}">${x}</button>`).join('')}</div>
    <div class="lbl2">Moneda y cuánto necesitas</div>${monHtml('z', mon0, e.objetivo)}
    <div class="lbl2">¿Para cuándo? <small>(opcional)</small></div><input id="zFec" class="inp" type="date" value="${esc(e.fecha || '')}" min="${hoy()}">
    ${m ? '' : '<div class="lbl2">Ya tengo guardado <small>(opcional)</small></div><input id="zIni" class="inp" inputmode="decimal" placeholder="0" autocomplete="off">'}
    <div class="err" id="zErr"></div>
    <button class="btn primary" id="zOk">Guardar</button>
    ${m ? '<button class="btn danger" id="zDel">Eliminar meta</button>' : ''}
    <button class="btn ghost" id="zNo">Cancelar</button>`);
  const getMon = ligarMon('z', mon0);
  $('#zEmo').onclick = ev => { const b = ev.target.closest('[data-emo]'); if(b){ emo = b.dataset.emo; marcarChip($('#zEmo'), 'emo', emo); } };
  if(m && $('#zApo')) $('#zApo').onclick = () => abrirAporte(m);
  if(m && $('#zAps')) $('#zAps').onclick = ev => { const b = ev.target.closest('[data-ap]'); if(!b) return; const x = m.aportes.find(y => y.id === b.dataset.ap);
    if(!x || !confirm(`¿Quitar el movimiento de ${fmtEn(Math.abs(x.monto), mon0)} del ${fechaCorta(x.fecha)}?`)) return; m.aportes = m.aportes.filter(y => y !== x); save(); render(); abrirMeta(m); toast('Quitado'); };
  $('#zNo').onclick = cerrarSheet;

    if(m) Object.assign(m, datos);
    else { const ini = parseMonto($('#zIni').value); S.metas.push(Object.assign({id: uid(), creado: Date.now(), aportes: ini > 0 ? [{id: uid(), monto: ini, fecha: hoy(), nota: 'Lo que ya tenía'}] : []}, datos)); }
    save(); cerrarSheet(); render(); toast(m ? 'Cambios guardados' : '🐷 Meta creada');

function abrirAporte(m){
  const mon = monOk(m.mon); let tipo = 'mas';
  abrirSheet(`<h2>${esc(m.e || '🎯')} ${esc(m.nombre)}</h2>
    <div class="seg" id="apT"><button type="button" data-t="mas" class="on">💰 Aportar</button><button type="button" data-t="menos">↩️ Retirar</button></div>
    <label class="monto" style="margin-top:12px"><span>${esc(mon)}</span><input id="apMonto" inputmode="decimal" placeholder="0" autocomplete="off"></label>
    <div class="lbl2">Fecha</div><input id="apFec" class="inp" type="date" value="${hoy()}" max="${hoy()}">
    <input id="apNota" class="inp" placeholder="Nota (opcional)" style="margin-top:12px" autocomplete="off">
    <div class="err" id="apErr"></div>
    <button class="btn primary" id="apOk">Guardar</button>
    <button class="btn ghost" id="apNo">‹ Volver</button>`);
  $('#apT').onclick = ev => { const b = ev.target.closest('[data-t]'); if(b){ tipo = b.dataset.t; marcarChip($('#apT'), 't', tipo); } };
  $('#apNo').onclick = () => abrirMeta(m);
  $('#apOk').onclick = () => {
    const v = parseMonto($('#apMonto').value), fecha = $('#apFec').value, nota = $('#apNota').value.trim().slice(0, 120);
    if(!(v > 0)){ $('#apErr').textContent = 'Escribe el monto.'; $('#apMonto').focus(); return; }
    if(!reFecha.test(fecha)){ $('#apErr').textContent = 'Elige la fecha.'; return; }
    if(tipo === 'menos' && v > ahorradoMeta(m) + 0.001){ $('#apErr').textContent = 'No puedes retirar más de lo ahorrado (' + fmtEn(ahorradoMeta(m), mon) + ').'; return; }
    (m.aportes = m.aportes || []).push({id: uid(), monto: tipo === 'menos' ? -v : v, fecha, ...(nota ? {nota} : {})});
    save(); render(); abrirMeta(m);
    const falta = (+m.objetivo || 0) - ahorradoMeta(m);
    toast(falta <= 0 ? '🎉 ¡Llegaste a tu meta!' : (tipo === 'menos' ? '↩️ Retiro anotado' : '💰 Aporte anotado') + ' · faltan ' + fmtEn(falta, mon));
  };
  setTimeout(() => $('#apMonto') && $('#apMonto').focus(), 120);
}

      <div class="lbl2" style="margin-top:20px">Datos de la deuda</div>` : ''}
    <div class="lbl2">¿A quién o qué le debes?</div><input id="qNom" class="inp" placeholder="Ej. Banco, préstamo de la moto, Juan…" value="${esc(e.nombre)}" autocomplete="off">
    <div class="lbl2">Moneda y cuánto debes en total</div>${monHtml('q', m0, e.monto)}
    <div class="dos"><div><div class="lbl2">Cuota <small>(opcional)</small></div><input id="qCuo" class="inp" inputmode="decimal" placeholder="0" value="${+e.cuota > 0 ? esc(e.cuota) : ''}" autocomplete="off"></div>
      <div><div class="lbl2">Día de pago <small>(opcional)</small></div><input id="qDia" class="inp" inputmode="numeric" maxlength="2" value="${esc(e.dia || '')}" autocomplete="off"></div></div>
    <div class="lbl2">Desde cuándo</div><input id="qFec" class="inp" type="date" value="${esc(e.fecha || hoy())}" max="${hoy()}">
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="qCon"${e.contar !== false ? ' checked' : ''}> Cada pago cuenta como gasto (categoría «${esc(cat('deudas').n)}»)</label>
    <input id="qNota" class="inp" placeholder="Nota (opcional)" value="${esc(e.nota || '')}" autocomplete="off">
    <div class="err" id="qErr"></div>
    <button class="btn primary" id="qOk">Guardar</button>
    ${d ? '<button class="btn danger" id="qDel">Eliminar deuda</button>' : ''}
    <button class="btn ghost" id="qNo">Cancelar</button>`);
  const getMon = ligarMon('q', m0);
  if(d && $('#qPag')) $('#qPag').onclick = () => abrirPagoDeuda(d, () => abrirDeuda(d));
  if(d && $('#qPags')) $('#qPags').onclick = ev => { const b = ev.target.closest('[data-pd]'); if(!b) return; const p = d.pagos.find(x => x.id === b.dataset.pd);
    if(!p || !confirm(`¿Quitar el pago de ${fmtEn(p.monto, m0)} del ${fechaCorta(p.fecha)}?${p.gastoId ? '\n\nTambién se quita el gasto que se anotó.' : ''}`)) return;
    d.pagos = d.pagos.filter(x => x !== p); if(p.gastoId) S.gastos = S.gastos.filter(g => g.id !== p.gastoId); save(); render(); abrirDeuda(d); toast('Pago quitado'); };
  $('#qNo').onclick = cerrarSheet;
  $('#qOk').onclick = () => {
    const nombre = $('#qNom').value.trim().slice(0, 60), monto = parseMonto($('#qMonto').value), cuota = parseMonto($('#qCuo').value), dia = entero($('#qDia').value), fecha = $('#qFec').value;
    if(!nombre){ $('#qErr').textContent = 'Escribe a quién o qué le debes.'; $('#qNom').focus(); return; }
    if(!(monto > 0)){ $('#qErr').textContent = 'Escribe cuánto debes en total.'; $('#qMonto').focus(); return; }
    const datos = {nombre, monto, mon: getMon(), cuota: cuota > 0 ? cuota : '', dia: dia >= 1 && dia <= 31 ? dia : '', fecha: reFecha.test(fecha) ? fecha : hoy(), nota: $('#qNota').value.trim().slice(0, 120), contar: $('#qCon').checked};
    if(d) Object.assign(d, datos); else S.deudas.push(Object.assign({id: uid(), creado: Date.now(), pagos: []}, datos));

  if(d) $('#qDel').onclick = () => { if(!confirm(`¿Eliminar la deuda «${d.nombre}»?\n\nLos gastos de sus pagos se quedan.`)) return; const i = S.deudas.indexOf(d); if(i < 0) return;
    S.deudas.splice(i, 1); save(); cerrarSheet(); render(); toast('Deuda eliminada', () => { S.deudas.splice(i, 0, d); save(); render(); }); };
  if(!d) setTimeout(() => $('#qNom') && $('#qNom').focus(), 120);
}
function abrirPagoDeuda(d, volver){
  const m = monOk(d.mon), sa = saldoDeuda(d), sug = +d.cuota > 0 ? Math.min(+d.cuota, sa) : sa;
  abrirSheet(`<h2>Pago: ${esc(d.nombre)}</h2>
    <p class="hint" style="margin-top:0">Te falta ${fmtEn(sa, m)}${+d.cuota > 0 ? ' · cuota ' + fmtEn(d.cuota, m) : ''}</p>
    <label class="monto"><span>${esc(m)}</span><input id="qpMonto" inputmode="decimal" autocomplete="off" value="${sug || ''}"></label>
    <button type="button" class="link" id="qpTodo" style="margin-top:0">Pagué todo (${fmtEn(sa, m)})</button>
    <div class="lbl2">Fecha</div><input id="qpFec" class="inp" type="date" value="${hoy()}" max="${hoy()}">
    <input id="qpNota" class="inp" placeholder="Nota (opcional)" style="margin-top:12px" autocomplete="off">
    <p class="hint">${d.contar !== false ? 'Se anota también como gasto en «' + esc(cat('deudas').n) + '».' : 'No se anota como gasto.'}</p>
    <div class="err" id="qpErr"></div>
    <button class="btn primary" id="qpOk">Guardar pago</button>
    <button class="btn ghost" id="qpNo">${volver ? '‹ Volver' : 'Cancelar'}</button>`);
  $('#qpTodo').onclick = () => { $('#qpMonto').value = sa; };
  $('#qpNo').onclick = () => volver ? volver() : cerrarSheet();
  $('#qpOk').onclick = () => {
    const monto = parseMonto($('#qpMonto').value), fecha = $('#qpFec').value, nota = $('#qpNota').value.trim().slice(0, 120);
    if(!(monto > 0)){ $('#qpErr').textContent = 'Escribe cuánto pagaste.'; $('#qpMonto').focus(); return; }
    if(!reFecha.test(fecha)){ $('#qpErr').textContent = 'Elige la fecha.'; return; }
    if(monto > sa + 0.001 && !confirm(`Te faltaba ${fmtEn(sa, m)} y anotaste ${fmtEn(monto, m)}. ¿Guardar igual?`)) return;
    const p = {id: uid(), monto, fecha, ...(nota ? {nota} : {})};
    if(d.contar !== false){ const g = {id: uid(), creado: Date.now(), monto, mon: m, desc: 'Pago: ' + d.nombre, cat: catOk('deudas'), metodo: 'Efectivo', fecha, nota}; S.gastos.push(g); p.gastoId = g.id; }
    (d.pagos = d.pagos || []).push(p);
    save(); render(); volver ? volver() : cerrarSheet();
    toast(saldoDeuda(d) <= 0 ? '🎉 ¡Terminaste de pagar ' + d.nombre + '!' : '💵 Pago anotado · te falta ' + fmtEn(saldoDeuda(d), m));
  };
}
function tarDeudaHtml(t){
  const de = deudaTar(t), lim = +t.limite || 0;
  return `<div class="pres-res"><div><small>Debes</small><b class="${de > 0 ? 'rojo' : 'pos'}">${fmt(de)}</b></div><div><small>Gastado</small><b>${fmt(gastadoTar(t))}</b></div><div><small>Pagado</small><b class="pos">${fmt(pagadoTar(t))}</b></div></div>
    ${lim ? `<div class="conv">Usas ${Math.round(de / lim * 100)}% de tu límite · disponible ${fmt(Math.max(0, lim - de))}</div>` : ''}

const ES_SERVIDOR = location.hostname === 'gastos.monitoreo-electrico-all.win';   // ahi sigue el login del servidor
const PIN_KEY = KEY + '-pin';
function pinGuardado(){ try{ const p = JSON.parse(localStorage.getItem(PIN_KEY) || 'null'); return p && p.sal && p.hash ? p : null; }catch(e){ return null; } }
async function hashPin(pin, sal){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sal + ':' + pin));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
async function pinOk(pin){ const p = pinGuardado(); return !p || (await hashPin(pin, p.sal)) === p.hash; }
async function ponerPin(pin){ const sal = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(PIN_KEY, JSON.stringify({sal, hash: await hashPin(pin, sal)})); }
const pinValido = p => /^\d{4,6}$/.test(p);
let bqEntrada = '', bqErrores = 0, bqEsperaHasta = 0, ocultoDesde = 0;
function pintarPuntos(){ const p = pinGuardado(); $('#bqPts').innerHTML = Array.from({length: (p && p.largo) || Math.max(4, bqEntrada.length)}, (_, i) => `<i class="${i < bqEntrada.length ? 'on' : ''}"></i>`).join(''); }
function bloquear(){
  if(!pinGuardado()) return;
  bqEntrada = ''; $('#bqMsg').textContent = 'Escribe tu PIN'; pintarPuntos();
  $('#bqTec').innerHTML = ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k => k ? `<button type="button" data-k="${k}">${k}</button>` : '<span></span>').join('');
  $('#bloqueo').hidden = false;
}
async function teclaPin(k){
  if(Date.now() < bqEsperaHasta){ $('#bqMsg').textContent = 'Espera ' + Math.ceil((bqEsperaHasta - Date.now()) / 1000) + ' s'; return; }
  if(k === '⌫'){ bqEntrada = bqEntrada.slice(0, -1); pintarPuntos(); return; }
  if(bqEntrada.length >= 6) return;
  bqEntrada += k; pintarPuntos();
  if(bqEntrada.length >= 4 && await pinOk(bqEntrada)){ bqErrores = 0; $('#bloqueo').hidden = true; bqEntrada = ''; return; }
  if(bqEntrada.length === 6 || (bqEntrada.length >= 4 && bqEntrada.length === (pinGuardado().largo || 0))){
    bqErrores++; bqEntrada = ''; pintarPuntos();
    if(bqErrores >= 5){ bqEsperaHasta = Date.now() + 30000; bqErrores = 0; $('#bqMsg').textContent = 'Demasiados intentos. Espera 30 s'; }
    else $('#bqMsg').textContent = 'PIN incorrecto';

  }
}
$('#bqTec').addEventListener('click', ev => { const b = ev.target.closest('[data-k]'); if(b) teclaPin(b.dataset.k); });
document.addEventListener('keydown', ev => { if(!$('#bloqueo').hidden){ if(/^\d$/.test(ev.key)) teclaPin(ev.key); else if(ev.key === 'Backspace') teclaPin('⌫'); ev.stopPropagation(); } }, true);

  const cur = mesActual(), [y, m] = mes.split('-').map(Number), dim = diasEnMes(y, m-1);
  const esCur = mes === cur;
  const dias = esCur ? new Date().getDate() : (mes < cur ? dim : 0);
  let h = avisos();
  if(!S.gastos.length && !S.fijos.length && !S.ingresos.length && !S.ingFijos.length) h += bienvenida();

  // Tarjeta principal
  let proy = '';
  if(esCur && dias >= 3 && dias < dim && tv > 0)
    proy = `<div class="proy">📈 A este ritmo cerrarías el mes en <b>${fmt(tv/dias*dim + tf)}</b></div>`;
  const vista = monVista || monBase();
  h += `<section class="card"><div class="lbl lbl-row"><span>Gastado en ${nombreMes(mes)}</span><div class="seg mini">${[monBase(), monOtra()].map(m => `<button type="button" data-act="verEn" data-v="${m}" class="${m === vista ? 'on' : ''}">${esc(m)}</button>`).join('')}</div></div>
    ${vista !== monBase() ? `<div class="tasa-nota">Todo en ${vista === 'US$' ? 'dólares' : esc(vista)} con la tasa 1 US$ = ${tasa().toFixed(2)} C$</div>` : ''}
    <div class="big">${fmt(total)}</div>
    <div class="split"><span>🛍️ Compras <b>${fmt(tv)}</b></span><span>🔁 Fijos <b>${fmt(tf)}</b></span></div>
    ${proy}${presupuestoHtml(total)}</section>`;

  // Ingresos, negocio y lo que queda (23/11/2026)
  const iv = sum(ingresosMes(mes)), ifj = totalIngFijos(mes), ti = iv + ifj;
  const nm = negocioMes(mes), conNeg = S.ajustes.negEnQueda !== 'no' && (nm.cobrado > 0 || nm.compras > 0);
  const queda = ti - total + (conNeg ? nm.cobrado - nm.compras : 0);
  if(ti > 0 || conNeg)
    h += `<section class="card"><div class="lbl">Te queda en ${nombreMes(mes)}</div>
      <div class="big ${queda >= 0 ? 'pos' : 'neg'}">${fmt(queda)}</div>
      <div class="split"><span>💰 Ingresos <b>${fmt(ti)}</b></span><span>💸 Gastos <b>${fmt(total)}</b></span>${conNeg ? `<span>🏪 Clientes <b>${nm.cobrado - nm.compras >= 0 ? '+' : ''}${fmt(nm.cobrado - nm.compras)}</b></span>` : ''}</div>
      ${ifj > 0 && iv > 0 ? `<div class="proy">Salario ${fmt(ifj)} + otros ingresos ${fmt(iv)}</div>` : ''}
      ${conNeg ? `<div class="proy">Clientes: cobrado ${fmt(nm.cobrado)} − créditos comprados ${fmt(nm.compras)}</div>` : ''}</section>`;
  else h += `<button class="card ing-add" data-act="nuevoIng"><span>💰</span><span><b>Anotar un ingreso</b><small>salario, ventas, un pago que te hicieron… y ves cuánto te queda</small></span></button>`;
  const deben = teDeben();
  if(deben > 0)
    h += `<button class="card ing-add" data-act="tab" data-tab="negocio"><span>🤝</span><span><b>Te deben ${fmt(deben)}</b><small>préstamos que hiciste (aparte, no cuentan como gasto)</small></span></button>`;
  const nRen = porRenovar().length;
  if(nRen > 0)
    h += `<button class="card ing-add" data-act="tab" data-tab="negocio"><span>⏰</span><span><b>${plural(nRen, 'cliente por renovar', 'clientes por renovar')}</b><small>vencidos o vencen en ${diasAviso()} días — toca para decidir</small></span></button>`;
  const fia = teDebenFiado();
  if(fia > 0) h += `<button class="card ing-add" data-act="tab" data-tab="negocio"><span>📝</span><span><b>Fiado: te deben ${fmt(fia)}</b><small>ventas que aún no te pagan completas</small></span></button>`;

  // Indicadores
  const prev = addYM(mes, -1);
  const corte = esCur ? pad(new Date().getDate()) : '31';
  const prevComp = sum(gastosMes(prev).filter(g => g.fecha.slice(8) <= corte)) + totalFijos(prev);
  let delta = '';
  if(prevComp > 0){
    const p = Math.round((total - prevComp) / prevComp * 100);
    delta = `<em class="${p > 0 ? 'up' : 'down'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}%</em>`;
  }
  const hoyTot = esCur ? sum(S.gastos.filter(g => g.fecha === hoy())) : null;
  h += `<div class="stats">
    <div class="stat"><small>Promedio por día</small><b>${fmt(dias ? tv/dias : 0)}</b></div>
    ${esCur ? `<div class="stat"><small>Hoy</small><b>${fmt(hoyTot)}</b></div>` : `<div class="stat"><small>Compras</small><b>${gs.length}</b></div>`}
    <div class="stat"><small>${esCur ? 'vs. mismo día mes pasado' : 'vs. mes anterior'}</small><b>${prevComp > 0 ? delta : '—'}</b></div>
  </div>`;

  // Hormiga
  const r = ritmoHormiga();
  if(r && r.total > 0)
    h += `<button class="card ant" data-act="tab" data-tab="hormiga"><span class="e">🐜</span><span>
      <span class="lbl">Gastos hormiga a este ritmo</span><br>
      <b>${fmt(r.mensual)} al mes</b><span class="p">≈ ${fmt(r.anual)} al año · ${r.veces} compras pequeñas en ${r.dias} días</span></span></button>`;

  // Rápido
  const rap = frecuentes(8);
  if(rap.length)
    h += `<section class="card"><h3>Anotar rápido <small>toca y guarda</small></h3><div class="chips">${
      rap.map(g => `<button class="chip" data-act="rapido" data-id="${g.id}">${cat(g.cat).e} ${esc(g.desc)}<small>${fmtM(g)}</small></button>`).join('')
    }</div></section>`;

  // Próximos cobros (y los ingresos fijos que vienen)
  if(esCur){
    const prox = S.fijos.filter(f => !f.pausadoDesde).map(f => ({f, d: proximoCobro(f, hoy()), ing: false}))
      .concat(S.ingFijos.filter(f => !f.pausadoDesde).map(f => ({f, d: proximoCobro(f, hoy()), ing: true})))
      .filter(x => diasHasta(x.d) <= 7).sort((a,b) => a.d < b.d ? -1 : 1);
    if(prox.length)
      h += `<section class="card"><h3>Próximos 7 días <small>cobros y salario</small></h3><div class="list">${
        prox.map(({f,d,ing}) => `<button class="item${ing ? ' ing' : ''}" data-act="${ing ? 'editIF' : 'editF'}" data-id="${f.id}"><span class="ico">${ing ? icat(f.cat).e : cat(f.cat).e}</span>
          <span class="txt"><b>${esc(f.nombre)}</b><small>${fechaCorta(d)} · ${cuando(diasHasta(d))}</small></span><span class="amt">${ing ? '+' : ''}${fmtM(f)}${otraMon(f) ? `<small>≈ ${fmt(mB(f))}</small>` : ''}</span></button>`).join('')
      }</div></section>`;
  }

  // Pagos de deudas que vienen (tarjetas de credito y prestamos)
  if(esCur){
    const pd = tarCredito().filter(t => t.pago && deudaTar(t) > 0).map(t => ({t, d: proxDia(t.pago)}))
      .concat(S.deudas.filter(x => x.dia && saldoDeuda(x) > 0).map(x => ({x, d: proxDia(x.dia)}))).filter(o => diasHasta(o.d) <= 7).sort((a,b) => a.d < b.d ? -1 : 1);
    if(pd.length)
      h += `<section class="card"><h3>💳 Pagos de deudas <small>7 días</small></h3><div class="list">${pd.map(o => o.t
        ? `<button class="item" data-act="editTar" data-id="${o.t.id}"><span class="ico">💳</span><span class="txt"><b>${esc(nomTar(o.t))}</b><small>${fechaCorta(o.d)} · ${cuando(diasHasta(o.d))}</small></span><span class="amt">${fmt(deudaTar(o.t))}<small>debes</small></span></button>`
        : `<button class="item" data-act="editDeuda" data-id="${o.x.id}"><span class="ico">🧾</span><span class="txt"><b>${esc(o.x.nombre)}</b><small>${fechaCorta(o.d)} · ${cuando(diasHasta(o.d))}</small></span><span class="amt">${fmtEn(+o.x.cuota > 0 ? Math.min(+o.x.cuota, saldoDeuda(o.x)) : saldoDeuda(o.x), monOk(o.x.mon))}<small>${+o.x.cuota > 0 ? 'cuota' : 'debes'}</small></span></button>`).join('')}</div></section>`;
  }

  // Por categoría
  const porCat = {};
  gs.forEach(g => porCat[g.cat] = (porCat[g.cat] || 0) + mB(g));
  fijosDelMes(mes).forEach(f => porCat[f.cat] = (porCat[f.cat] || 0) + equivMensual(f));
  const arr = Object.entries(porCat).filter(x => x[1] > 0).sort((a,b) => b[1] - a[1]);
  if(arr.length){
    const max = arr[0][1];
    h += `<section class="card"><h3>¿En qué se va? <small>compras + fijos</small></h3><div class="bars">${
      arr.map(([id, v]) => { const c = cat(id), lim = limiteCat(id), pl = lim ? v / lim : 0; return `<button class="barrow${lim ? (pl > 1 ? ' over' : pl >= 0.8 ? ' near' : '') : ''}" data-act="filtroCat" data-cat="${id}">
        <span class="bl">${c.e} ${c.n}</span><span class="bv">${fmt(v)}<small>${lim ? 'de ' + fmt(lim) : Math.round(v/total*100) + '%'}</small></span>
        <span class="bt"><i style="width:${Math.max(2, lim ? Math.min(100, pl*100) : v/max*100)}%"></i></span></button>`; }).join('')
    }</div></section>`;
  }

  // Últimos
  const ult = gs.slice().sort(ordenG).slice(0, 5);
  if(ult.length)
    h += `<section class="card"><h3>Últimas compras <button class="link" style="margin:0" data-act="tab" data-tab="movs">Ver todas</button></h3><div class="list">${ult.map(itemG).join('')}</div></section>`;
  return h;
}

function presupuestoHtml(total){
  const p = +S.ajustes.presupuesto;
  if(!p) return `<button class="link" data-act="tab" data-tab="ajustes">+ Poner un presupuesto mensual</button>`;
  const pct = total / p * 100;
  const est = pct > 100 ? 'bad' : pct >= 80 ? 'warn' : 'good';
  const txt = pct > 100 ? `⚠️ Te pasaste por ${fmt(total - p)}` : pct >= 80 ? `⚠️ Quedan ${fmt(p - total)} de ${fmt(p)}` : `Quedan ${fmt(p - total)} de ${fmt(p)}`;
  return `<div class="pbar ${est}"><i style="width:${Math.min(pct, 100)}%"></i></div><div class="ptxt"><span>${txt}</span><b>${Math.round(pct)}%</b></div>`;
}

function ordenG(a, b){ return a.fecha === b.fecha ? (b.creado || 0) - (a.creado || 0) : (a.fecha < b.fecha ? 1 : -1); }

function frecuentes(n){
  const map = new Map();
  S.gastos.slice().sort(ordenG).forEach(g => {
    if(!g.desc) return;
    const k = norm(g.desc);
    const o = map.get(k);
    if(o) o.c++; else map.set(k, {g, c:1});
  });
  return [...map.values()].sort((a,b) => b.c - a.c).slice(0, n).map(x => x.g);
}

function itemG(g){
  const c = cat(g.cat);
  return `<button class="item" data-act="editG" data-id="${g.id}"><span class="ico">${c.e}</span>
    <span class="txt"><b>${esc(g.desc || c.n)}</b><small>${esc(c.n)}${g.metodo ? ' · ' + esc(nomPago(g)) : ''}${esHormiga(g) ? ' · 🐜' : ''}${nFotos(g)}${g.nota ? ' · ' + esc(g.nota) : ''}</small></span>
    <span class="amt">${fmtM(g)}${otraMon(g) ? `<small>≈ ${fmt(mB(g))}</small>` : ''}</span></button>`;
}

function itemI(i){
  const c = icat(i.cat);
  return `<button class="item ing" data-act="editI" data-id="${i.id}"><span class="ico">${c.e}</span>
    <span class="txt"><b>${esc(i.desc || c.n)}</b><small>${esc(c.n)}${i.metodo ? ' · ' + esc(METODO_ING_TXT[i.metodo] || i.metodo) : ''}${nFotos(i)}${i.nota ? ' · ' + esc(i.nota) : ''}</small></span>
    <span class="amt">+${fmtM(i)}${otraMon(i) ? `<small>≈ ${fmt(mB(i))}</small>` : ''}</span></button>`;
}
function itemIF(f){
  const c = icat(f.cat), pa = !!f.pausadoDesde;
  const nx = pa ? null : proximoCobro(f, hoy());
  const sub = FREC[f.frecuencia].n + (pa ? ' · Pausado' : ' · próximo ' + fechaCorta(nx) + ' (' + cuando(diasHasta(nx)) + ')');
  return `<button class="item ing${pa ? ' off' : ''}" data-act="editIF" data-id="${f.id}"><span class="ico">${c.e}</span>
    <span class="txt"><b>${esc(f.nombre)}</b><small>${sub}</small></span>
    <span class="amt">+${fmtM(f)}${f.frecuencia !== 'mensual' ? `<small>≈ ${fmt(equivMensual(f))}/mes</small>` : otraMon(f) ? `<small>≈ ${fmt(mB(f))}</small>` : ''}</span></button>`;
}

function vMovs(){
  let h = `<input class="inp search" id="buscar" type="search" placeholder="🔍 Buscar en todos los meses (ej. taxi, venta)" value="${esc(busqueda)}" autocomplete="off">`;
  if(!filtroCat) h += `<div class="seg ver-seg">${[['todo','Todo'],['gastos','🛍️ Gastos'],['ingresos','💰 Ingresos']].map(([k,n]) => `<button type="button" data-act="verMov" data-v="${k}" class="${verMov === k ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  if(filtroCat) h += `<div class="filtro"><span>${cat(filtroCat).e} Solo ${cat(filtroCat).n}</span><button data-act="quitarFiltro">Quitar ✕</button></div>`;
  return h + `<div id="lista"></div>`;
}

function llenarLista(){
  const q = norm(busqueda);
  let gs = q ? S.gastos.filter(g => norm(g.desc + ' ' + (g.nota || '') + ' ' + cat(g.cat).n + ' ' + nomPago(g)).includes(q)) : gastosMes(mes);
  if(filtroCat) gs = gs.filter(g => g.cat === filtroCat);
  let is = filtroCat ? [] : (q ? S.ingresos.filter(i => norm(i.desc + ' ' + (i.nota || '') + ' ' + icat(i.cat).n).includes(q)) : ingresosMes(mes));
  const ver = filtroCat ? 'todo' : verMov;
  if(ver === 'ingresos') gs = [];
  if(ver === 'gastos') is = [];
  const esIng = new Set(is), todos = gs.concat(is).sort(ordenG);
  let h = '';
  if(!q && !filtroCat){   // resumen del mes (lo anotado; los fijos van aparte, abajo)
    const tg = sum(gs), ti = sum(is);
    h += `<div class="card resmov">${ver !== 'ingresos' ? `<div><small>🛍️ Gastos</small><b>${fmt(tg)}</b></div>` : ''}${ver !== 'gastos' ? `<div><small>💰 Ingresos</small><b class="pos">+${fmt(ti)}</b></div>` : ''}${ver === 'todo' ? `<div><small>Diferencia</small><b class="${ti - tg >= 0 ? 'pos' : 'neg'}">${fmt(ti - tg)}</b></div>` : ''}</div>`;
  }
  if(!todos.length){
    const que = ver === 'gastos' ? 'gastos anotados' : ver === 'ingresos' ? 'ingresos anotados' : 'compras ni ingresos anotados';
    h += `<div class="card empty"><div class="e">${q ? '🔍' : '🧾'}</div>${q ? 'No encontré nada con «' + esc(busqueda) + '».' : 'No hay ' + que + ' en ' + nombreMes(mes) + '.<br>Toca <b>+</b> para anotar uno.'}</div>`;
  } else {
    if(q || filtroCat) h += `<div class="card" style="display:flex;justify-content:space-between;gap:10px"><span>${gs.length} compras${is.length ? ' · ' + is.length + ' ingresos' : ''}</span><b class="num">${gs.length ? fmt(sum(gs)) : ''}${is.length ? `<em class="ingv">+${fmt(sum(is))}</em>` : ''}</b></div>`;
    const dias = new Map();
    todos.forEach(x => { if(!dias.has(x.fecha)) dias.set(x.fecha, []); dias.get(x.fecha).push(x); });
    h += '<div class="card" style="padding-top:8px;padding-bottom:6px">';
    for(const [d, arr] of dias){
      const et = q && d.slice(0,7) !== mesActual() ? etiquetaDia(d) + ' ' + d.slice(0,4) : etiquetaDia(d);
      const dg = arr.filter(x => !esIng.has(x)), di = arr.filter(x => esIng.has(x));
      h += `<div class="dia"><span>${et}</span><span class="num">${dg.length ? fmt(sum(dg)) : ''}${di.length ? `<em class="ingv">+${fmt(sum(di))}</em>` : ''}</span></div><div class="list">${arr.map(x => esIng.has(x) ? itemI(x) : itemG(x)).join('')}</div>`;
    }
    h += '</div>';
  }
  if(!q){
    const tf = ver === 'ingresos' ? 0 : totalFijos(mes), tif = filtroCat || ver === 'gastos' ? 0 : totalIngFijos(mes);
    if(tf > 0 || tif > 0) h += `<p class="foot">Además, este mes${tf > 0 ? ' tus fijos suman ' + fmt(tf) : ''}${tf > 0 && tif > 0 ? ' y' : ''}${tif > 0 ? ' tu salario suma +' + fmt(tif) : ''} — <button class="link" style="margin:0" data-act="tab" data-tab="fijos">ver fijos</button></p>`;
  }
  $('#lista').innerHTML = h;
}

function itemF(f){
  const c = cat(f.cat), pa = !!f.pausadoDesde;
  const nx = pa ? null : proximoCobro(f, hoy());
  const sub = FREC[f.frecuencia].n + (pa ? ' · Pausado' : ' · próximo ' + fechaCorta(nx) + ' (' + cuando(diasHasta(nx)) + ')');
  return `<button class="item${pa ? ' off' : ''}" data-act="editF" data-id="${f.id}"><span class="ico">${c.e}</span>
    <span class="txt"><b>${esc(f.nombre)}</b><small>${sub}</small></span>
    <span class="amt">${fmtM(f)}${f.frecuencia !== 'mensual' ? `<small>≈ ${fmt(equivMensual(f))}/mes</small>` : otraMon(f) ? `<small>≈ ${fmt(mB(f))}</small>` : ''}</span></button>`;
}

function vFijos(){
  const act = S.fijos.filter(f => !f.pausadoDesde);
  const tm = act.reduce((a,f) => a + equivMensual(f), 0);
  const subs = act.filter(f => f.tipo === 'suscripcion').reduce((a,f) => a + equivMensual(f), 0);
  let h = `<section class="card"><div class="lbl">Lo fijo te cuesta al mes</div><div class="big">${fmt(tm)}</div>
    <div class="split"><span>📺 Suscripciones <b>${fmt(subs)}</b></span><span>🏠 Otros fijos <b>${fmt(tm - subs)}</b></span></div>
    <div class="proy">Al año: <b>${fmt(tm*12)}</b>${subs > 0 ? ` · solo suscripciones: <b>${fmt(subs*12)}</b>` : ''}</div></section>`;
  const tim = S.ingFijos.filter(f => !f.pausadoDesde).reduce((a,f) => a + equivMensual(f), 0);
  if(tim > 0) h += `<section class="card"><div class="lbl">Salario al mes</div><div class="big pos">${fmt(tim)}</div>
    <div class="split"><span>💸 Lo fijo <b>${fmt(tm)}</b></span><span>${tim - tm >= 0 ? '✅' : '⚠️'} Después de lo fijo te queda <b>${fmt(tim - tm)}</b></span></div></section>`;
  if(!S.fijos.length && !S.ingFijos.length){
    return h + `<div class="card empty"><div class="e">🔁</div>Anota aquí todo lo que pagas cada mes, quincena o año:<br>alquiler, luz, agua, internet, plan del celular, Netflix, Spotify, gimnasio, cuotas…<br><br>Se suman solos cada mes — <b>no los anotes también como compra</b>.<br>También tu salario: toca <b>+</b> y elige <b>💼 Salario</b>.<br><button class="btn primary" data-act="nuevo">+ Agregar el primero</button></div>`;
  }
  const grupos = [
    ['💼 Salario', S.ingFijos],
    ['📺 Suscripciones', S.fijos.filter(f => f.tipo === 'suscripcion')],
    ['🏠 Gastos fijos', S.fijos.filter(f => f.tipo !== 'suscripcion')]
  ];
  for(const [t, arr] of grupos){
    if(!arr.length) continue;
    arr.sort((a,b) => (!!a.pausadoDesde - !!b.pausadoDesde) || equivMensual(b) - equivMensual(a));
    h += `<section class="card"><h3>${t} <small>${arr.length}</small></h3><div class="list">${arr.map(arr === S.ingFijos ? itemIF : itemF).join('')}</div></section>`;
  }
  return h + `<p class="foot">Los fijos se suman solos a cada mes. Toca uno para editarlo o pausarlo.</p>`;
}

function vHormiga(){
  const u = +S.ajustes.umbral || 0;
  const r = ritmoHormiga();
  if(!r || !r.veces){
    return `<div class="card empty"><div class="e">🐜</div><b>Aún no hay gastos hormiga</b><br>
      Aquí aparecen las compras pequeñas (de ${fmt(u)} o menos) que se repiten: el cafecito, la gaseosa, el snack, el delivery, la recarga…
      Una sola no se siente, pero sumadas al año pueden ser mucho dinero.<br><br>Anota todo lo que compres durante unos días y vuelve aquí.</div>` + excluidosHtml();
  }
  const pct = r.totalVar ? Math.round(r.total / r.totalVar * 100) : 0;
  let h = `<section class="card ant" style="display:block"><div style="display:flex;gap:12px;align-items:center"><span class="e">🐜</span>
      <div><div class="lbl">A este ritmo se te van</div><div class="big" style="margin:0">${fmt(r.mensual)}<span style="font-size:16px;font-weight:600"> al mes</span></div></div></div>
      <p style="font-size:15px;margin-top:10px">Eso es <b>${fmt(r.anual)} al año</b> en compras pequeñas.</p>
      <p>${r.veces} compras de ${fmt(u)} o menos en los últimos ${r.dias} días · ${pct}% de lo que compraste${r.dias < 7 ? '<br>ℹ️ Con pocos días anotados el cálculo es aproximado.' : ''}</p></section>`;
  const top = r.grupos[0];
  if(top && top.veces >= 2){
    h += `<section class="card tip">💡 Solo <b>«${esc(top.nombre)}»</b> te cuesta ≈ <b>${fmt(top.anual)}</b> al año.
      Si lo reduces a la mitad, ahorras <b>${fmt(top.anual/2)}</b>.</section>`;
  }
  h += `<section class="card"><h3>Tus hormigas <small>últimos ${r.dias} días</small></h3>${
    r.grupos.map(g => `<div class="grp"><span class="ico" style="width:40px;height:40px;border-radius:12px;background:var(--track);display:grid;place-items:center;font-size:20px;flex:none">${cat(g.cat).e}</span>
      <div class="txt"><b>${esc(g.nombre)}${g.veces >= 3 ? '<span class="tag">frecuente</span>' : ''}</b>
        <small>${g.veces} ${g.veces === 1 ? 'vez' : 'veces'} · prom. ${fmt(g.total/g.veces)}</small><br>
        <button class="x" data-act="excluir" data-k="${esc(g.k)}">No es hormiga</button></div>
      <div class="amt"><b>${fmt(g.mensual)}/mes</b><small>${fmt(g.anual)}/año</small></div></div>`).join('')
  }</section>`;
  const gm = gastosMes(mesActual()), hm = gm.filter(esHormiga);
  h += `<p class="foot">En ${nombreMes(mesActual())}: ${fmt(sum(hm))} en ${hm.length} compras hormiga.<br>Cuenta como hormiga toda compra de ${fmt(u)} o menos — cámbialo en <button class="link" style="margin:0" data-act="tab" data-tab="ajustes">Ajustes</button>.</p>`;
  return h + excluidosHtml();
}

function excluidosHtml(){

  return `<section class="card"><h3>No cuentan como hormiga <small>${ex.length}</small></h3><div class="chips">${
    ex.map(k => `<button class="chip" data-act="incluir" data-k="${esc(k)}">${esc(k.startsWith('cat:') ? cat(k.slice(4)).n : k)} <small>↩ volver a contar</small></button>`).join('')
  }</div></section>`;
}

    <button class="btn" data-act="nuevaCat">➕ Agregar categoría</button>

const EMOJIS = ['🍔','🍕','☕','🍺','🛒','🚕','🚌','🚗','⛽','✈️','🏠','💡','📱','📺','🔧','💊','🏥','👕','💇','🏋️','📚','👶','🐾','🎉','🎮','📦','🎁','💳','🧾','💼','⛪','🔹'];
function abrirCat(c, op){   // op = {tipo:'ing'} para tipos de ingreso; op.volver(extra) regresa a la hoja de antes
  op = op || {};
  const ing = op.tipo === 'ing', base = () => ing ? INGCATS : CATS;
  const nuevo = !c, e = c || (ing ? {id: '', n: '', e: '💰'} : {id: '', n: '', e: '🔹', g: 'Finanzas y otros'});
  let emo = e.e, grupo = e.g;
  const usos = c ? (ing ? usosIng(c.id) : usosCat(c.id)) : 0;
  const fija = !nuevo && (ing ? ING_FIJAS.includes(c.id) : c.id === 'otros');
  const otrosN = ing ? 'Otros ingresos' : 'Otros';
  const salir = extra => { render(); if(op.volver) op.volver(extra || {}); else cerrarSheet(); };
  abrirSheet(`<h2>${nuevo ? (ing ? 'Nuevo tipo de ingreso' : 'Nueva categoría') : (ing ? 'Editar tipo de ingreso' : 'Editar categoría')}</h2>
    <div class="lbl2">Nombre</div><input id="kNom" class="inp" maxlength="30" placeholder="${ing ? 'Ej. Comisiones' : 'Ej. Gimnasio'}" value="${esc(e.n)}" autocomplete="off">
    <div class="lbl2">Ícono</div><div class="emo-grid" id="kEmo">${EMOJIS.map(x => `<button type="button" data-emo="${x}" class="${x === emo ? 'on' : ''}">${x}</button>`).join('')}</div>
    <input id="kEmoTxt" class="inp" maxlength="8" placeholder="…o escribe otro emoji" value="${EMOJIS.includes(emo) ? '' : esc(emo)}" autocomplete="off">
    ${ing ? '' : `<div class="lbl2">Grupo</div><div class="cats-grid" id="kGrp">${CAT_GRUPOS.map(g => `<button type="button" class="chip${g === grupo ? ' on' : ''}" data-g="${g}">${g}</button>`).join('')}</div>`}
    <div class="err" id="kErr"></div>
    <button class="btn primary" id="kOk">Guardar</button>
    ${!nuevo && !fija ? `<button class="btn danger" id="kDel">Eliminar${usos ? ` (sus ${usos} pasan a «${otrosN}»)` : ''}</button>` : ''}
    <button class="btn ghost" id="kNo">${op.volver ? '‹ Volver' : 'Cancelar'}</button>`);
  $('#kEmo').onclick = ev => { const b = ev.target.closest('[data-emo]'); if(b){ emo = b.dataset.emo; $('#kEmoTxt').value = ''; marcarChip($('#kEmo'), 'emo', emo); } };
  $('#kEmoTxt').oninput = ev => { const v = ev.target.value.trim(); if(v){ emo = v; marcarChip($('#kEmo'), 'emo', ''); } };
  if($('#kGrp')) $('#kGrp').onclick = ev => { const b = ev.target.closest('[data-g]'); if(b){ grupo = b.dataset.g; marcarChip($('#kGrp'), 'g', grupo); } };
  $('#kNo').onclick = () => op.volver ? op.volver({}) : cerrarSheet();
  $('#kOk').onclick = () => {
    const n = $('#kNom').value.trim().slice(0, 30);
    if(!n){ $('#kErr').textContent = 'Ponle un nombre.'; return; }
    if(base().some(x => x.id !== e.id && norm(x.n) === norm(n))){ $('#kErr').textContent = ing ? 'Ya hay un tipo de ingreso con ese nombre.' : 'Ya hay una categoría con ese nombre.'; return; }
    const lista = base().map(x => Object.assign({}, x)), id = nuevo ? (ing ? 'i' : 'c') + uid() : e.id;
    const datos = ing ? {n, e: emo || '💰'} : {n, e: emo || '🔹', g: grupo};
    if(nuevo) lista.push(Object.assign({id}, datos)); else Object.assign(lista.find(x => x.id === e.id), datos);
    ing ? guardarIngCats(lista) : guardarCats(lista);
    salir(nuevo ? {cat: id} : {});
    toast(nuevo ? (ing ? '✓ Tipo de ingreso agregado' : '✓ Categoría agregada') : 'Cambios guardados');
  };
  if($('#kDel')) $('#kDel').onclick = () => {
    if(usos && !confirm(`¿Eliminar «${e.n}»?\n\nSus ${usos} ${ing ? 'ingresos' : 'compras y fijos'} pasan a «${otrosN}».`)) return;
    const otros = ing ? 'otros_ing' : 'otros', A = ing ? S.ingresos : S.gastos, B = ing ? S.ingFijos : S.fijos;
    const antes = base().map(x => Object.assign({}, x)), aIds = new Set(A.filter(x => x.cat === e.id).map(x => x.id)), bIds = new Set(B.filter(x => x.cat === e.id).map(x => x.id));
    A.forEach(x => { if(aIds.has(x.id)) x.cat = otros; });
    B.forEach(x => { if(bIds.has(x.id)) x.cat = otros; });
    if(filtroCat === e.id) filtroCat = null;
    ing ? guardarIngCats(base().filter(x => x.id !== e.id)) : guardarCats(base().filter(x => x.id !== e.id));
    salir({});
    toast(ing ? 'Tipo de ingreso eliminado' : 'Categoría eliminada', () => {
      ing ? guardarIngCats(antes) : guardarCats(antes);
      A.forEach(x => { if(aIds.has(x.id)) x.cat = e.id; });
      B.forEach(x => { if(bIds.has(x.id)) x.cat = e.id; });
      save(); render();
    });
  };
}

/* "✏️ Editar" junto a la categoria en las hojas: snap() guarda lo escrito, reabrir(datos) vuelve a la hoja */
function ligarEditCats(p, tipo, snap, reabrir){
  const cont = $('#'+p), btn = $('#'+p+'Ed');
  if(!cont || !btn) return;
  btn.onclick = () => {
    const on = !cont.classList.contains('editando'), grid = cont.querySelector('.cats-grid');
    cont.classList.toggle('editando', on);
    btn.textContent = on ? '✓ Listo' : '✏️ Editar';
    const nueva = grid.querySelector('.chip-nueva');
    if(on && !nueva) grid.insertAdjacentHTML('beforeend', `<button type="button" class="chip chip-nueva" data-nueva="1"><span class="ce">➕</span>${tipo === 'ing' ? 'Nuevo tipo' : 'Nueva'}</button>`);
    if(!on && nueva) nueva.remove();
  };
  cont.addEventListener('click', ev => {   // en modo editar, tocar una categoria la abre (no la elige)
    if(!cont.classList.contains('editando')) return;
    ev.stopImmediatePropagation();
    const b = ev.target.closest('[data-cat],[data-nueva]'); if(!b) return;
    const datos = snap(), c = b.dataset.nueva ? null : (tipo === 'ing' ? INGCATS : CATS).find(x => x.id === b.dataset.cat);
    abrirCat(c, {tipo, volver: extra => reabrir(Object.assign(datos, extra))});
  }, true);
}

  </section>
